<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Management Analysis</title>
    
    <!-- Core Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Excel Library (SheetJS) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        vazir: ['Vazirmatn', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        .dark body {
            background-color: #111827; /* dark:bg-gray-900 */
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease-in-out;
        }
        .modal-content {
            padding: 1.5rem;
            border-radius: 0.5rem;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s ease-in-out;
        }
        .modal-overlay.open .modal-content {
            transform: scale(1);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Toast Notification Styles */
        .toast-container {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .toast {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            animation: toast-in 0.5s ease;
            min-width: 300px;
        }
        .toast.success { background-color: #10B981; color: white; }
        .toast.error { background-color: #EF4444; color: white; }
        .toast.warning { background-color: #f97316; color: white; }
        @keyframes toast-in {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Print Styles - OPTIMIZED FOR FULL INVOICE DISPLAY */
        @media print {
            /* 1. Hide the entire body content, except for necessary containers */
            body * {
                visibility: hidden !important;
                overflow: hidden !important;
            }
            .print-options {
                display: none !important;
            }

            /* 2. Overwrite modal positioning/sizing to ensure it covers the page */
            .modal-overlay {
                visibility: visible !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: auto !important;
                background: white !important;
                display: block !important;
                z-index: 9999 !important;
            }
            
            .modal-content {
                position: static !important;
                width: 100% !important;
                max-width: none !important;
                max-height: none !important;
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                background: white !important;
                color: black !important;
                overflow: visible !important; /* Crucial: removes scrollbars/clipping */
                transform: none !important; /* Removes scale transformation */
            }

            /* 3. Make the printable content visible and full-width */
            #printable-invoice {
                visibility: visible !important;
                position: static !important;
                width: 100% !important;
                max-width: none !important;
                min-height: 100vh !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                color: black !important;
                direction: rtl;
                overflow: visible !important;
            }
            
            /* 4. Ensure all children inside the invoice are visible */
            #printable-invoice * {
                visibility: visible !important;
            }
            
        }
    </style>
</head>
<body class="dark text-gray-900 dark:text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        // ==================================================
        // Supabase Client Setup
        // ==================================================
        const { createClient } = supabase;
        const supabaseUrl = 'https://wehyjatotbzxargnxasg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlaHlqYXRvdGJ6eGFyZ254YXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE5MTIwMjEsImV4cCI6MjA2NzQ4ODAyMX0.2R448DuEBlTrNvaYXiYZ8D5M7MJNv7n1qmIDHQBNFiY';
        const supabaseClient = createClient(supabaseUrl, supabaseKey, { global: { fetch: window.fetch.bind(window) } });

        // ==================================================
        // Application Configuration
        // ==================================================
        const APP_CONFIG = {
            DEFAULT_SELLER_ID: 'f83dca6b-9bc3-4bc2-8ac0-609a4147269b',
            DEFAULT_CURRENCY: 'Toman'
        };

        // ==================================================
        // Toast Notification System
        // ==================================================
        const ToastContext = React.createContext();

        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = React.useState([]);

            const addToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    removeToast(id);
                }, 5000);
            };

            const removeToast = (id) => {
                setToasts(prev => prev.filter(toast => toast.id !== id));
            };

            return (
                <ToastContext.Provider value={{ addToast }}>
                    {children}
                    <div className="toast-container">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`toast ${toast.type}`}>
                                {toast.message}
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };

        const useToasts = () => {
            return React.useContext(ToastContext);
        };

        // ==================================================
        // Helper Functions & UI Components
        // ==================================================
        const formatCurrency = (value) => {
            if (value === null || typeof value === 'undefined' || isNaN(value)) return '-';
            // Use 'fa-IR' for Persian formatting (includes number grouping)
            return `${Number(value).toLocaleString('fa-IR')}`;
        };

        const formatNumberWithCommas = (value) => {
            if (value === null || value === undefined || value === '') {
                return '';
            }
            const stringValue = String(value).replace(/,/g, '');
            const numberValue = Number(stringValue);
            if (isNaN(numberValue)) {
                return '';
            }
            // Use 'en-US' for number input formatting (just commas)
            return numberValue.toLocaleString('en-US');
        };

        const parseFormattedNumber = (value) => {
            if (typeof value !== 'string' && typeof value !== 'number') {
                return 0;
            }
            if(typeof value === 'number') return value;
            return Number(value.replace(/,/g, '')) || 0;
        };

        // Helper to fetch user balance based on all payments and invoices
        const fetchUserBalance = async (userId) => {
            if (!userId) return 0;
            try {
                // 1. Get Total Payments (Credits)
                const { data: transactions, error: txError } = await supabaseClient
                    .from('usertransaction')
                    .select('amount')
                    .eq('userid', userId);
                
                if (txError) throw txError;
                const totalPaid = transactions.reduce((sum, tx) => sum + (tx.amount || 0), 0);

                // 2. Get Total Invoiced Amount (Debits)
                const { data: invoices, error: invError } = await supabaseClient
                    .from('demandinvoice')
                    .select('totalamount')
                    .eq('customeruserid', userId);

                if (invError) throw invError;
                const totalInvoiced = invoices.reduce((sum, inv) => sum + (inv.totalamount || 0), 0);
                
                // 3. Calculate Balance: (Money In) - (Money Owed)
                return totalPaid - totalInvoiced;
            } catch (err) {
                console.error('Exception fetching balance:', err);
                return 0;
            }
        };
        
        const Modal = ({ isOpen, onClose, title, children, showHeader = true }) => {
            if (!isOpen) return null;
            return (
                <div className="modal-overlay open" onClick={onClose}>
                    <div className="modal-content bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100" onClick={e => e.stopPropagation()}>
                        {showHeader && (
                            <div className="flex justify-between items-center mb-4 pb-3 border-b border-gray-200 dark:border-gray-600">
                                <h2 className="text-xl font-bold">{title}</h2>
                                <button onClick={onClose} className="text-gray-400 hover:text-gray-800 dark:hover:text-white text-2xl">&times;</button>
                            </div>
                        )}
                        {children}
                    </div>
                </div>
            );
        };

        // ==================================================
        // ConfirmDeleteModal Component
        // ==================================================
        const ConfirmDeleteModal = ({ isOpen, onClose, onConfirm, invoice }) => {
            if (!isOpen || !invoice) return null;
            return (
                <Modal isOpen={isOpen} onClose={onClose} title="تایید حذف فاکتور">
                    <div className="text-right">
                        <p className="mb-4 text-lg text-red-600 dark:text-red-400">
                            آیا مطمئن هستید که می‌خواهید فاکتور شماره <span className="font-mono font-bold">{invoice.id}</span> مربوط به مشتری <span className="font-bold">{invoice.customer?.fullname || 'نامشخص'}</span> را حذف کنید؟
                        </p>
                        <p className="text-sm text-gray-500 dark:text-gray-400">
                            توجه: این اقدام غیرقابل بازگشت است و فاکتور و جزئیات آن حذف خواهند شد. همچنین تراکنش‌های مرتبط با این فاکتور نیز حذف می‌شوند.
                        </p>
                    </div>
                    <div className="flex justify-end gap-4 mt-6">
                        <button onClick={onClose} className="bg-gray-200 dark:bg-gray-600 py-2 px-5 rounded-lg font-semibold">انصراف</button>
                        <button onClick={onConfirm} className="bg-red-600 text-white py-2 px-5 rounded-lg font-semibold hover:bg-red-700">حذف فاکتور</button>
                    </div>
                </Modal>
            );
        };

        // ==================================================
        // StatementOfAccountModal Component
        // ==================================================
        const StatementOfAccountModal = ({ isOpen, onClose, customerId, customerName, formatCurrency, supabaseClient }) => {
            const [history, setHistory] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(false);
            const { addToast } = useToasts();
            
            // Fetch detailed history
            React.useEffect(() => {
                if (!isOpen || !customerId) {
                    setHistory([]);
                    return;
                }

                const fetchHistory = async () => {
                    setIsLoading(true);
                    try {
                        // 1. Fetch Invoices (Debits to the customer)
                        const { data: invoicesData, error: invError } = await supabaseClient
                            .from('demandinvoice')
                            .select('id, createdat, totalamount, note')
                            .eq('customeruserid', customerId);
                        if (invError) throw invError;
                        
                        // 2. Fetch Payments/Transactions (Credits and other debits)
                        const { data: transactionsData, error: txError } = await supabaseClient
                            .from('usertransaction')
                            .select('id, createdat, amount, transactiontypeid')
                            .eq('userid', customerId);
                        if (txError) throw txError;

                        // 3. Merge and Normalize
                        const merged = [];
                        (invoicesData || []).forEach(inv => {
                            merged.push({
                                date: inv.createdat,
                                type: 'فاکتور فروش (بدهکار)', // Invoice amount owed by customer (Debit)
                                amount: -Math.abs(inv.totalamount), // Represent as negative for debit
                                refId: inv.id,
                                description: `فاکتور شماره ${inv.id}` + (inv.note ? ` - ${inv.note}` : '')
                            });
                        });
                        (transactionsData || []).forEach(tx => {
                            // Type 1: Customer Payment (Credit)
                            if (tx.transactiontypeid === 1) { 
                                merged.push({
                                    date: tx.createdat,
                                    type: 'دریافت وجه (بستانکار)',
                                    amount: Math.abs(tx.amount), // Represent as positive for credit
                                    refId: tx.id,
                                    description: `پرداخت از طریق تراکنش ${tx.id}`
                                });
                            }
                            // Type 2: Supplier Payout (Debit/Withdrawal)
                            else if (tx.transactiontypeid === 2) {
                                merged.push({
                                    date: tx.createdat,
                                    type: 'پرداخت به تامین‌کننده (برداشت)',
                                    amount: -Math.abs(tx.amount), // Ensure it is negative
                                    refId: tx.id,
                                    description: `تسویه حساب/برداشت طی تراکنش ${tx.id}`
                                });
                            }
                        });
                        
                        // 4. Sort chronologically
                        merged.sort((a, b) => new Date(a.date) - new Date(b.date));

                        // 5. Calculate Running Balance
                        let runningBalance = 0;
                        const finalHistory = merged.map(item => {
                            runningBalance += item.amount;
                            return { ...item, runningBalance };
                        });

                        setHistory(finalHistory);

                    } catch (err) {
                        console.error("Error fetching statement history:", err);
                        addToast('خطا در بارگذاری صورتحساب', 'error');
                    } finally {
                        setIsLoading(false);
                    }
                };

                fetchHistory();
            }, [isOpen, customerId]);

            const handleDownloadExcel = () => {
                if (!history || history.length === 0) {
                    addToast('هیچ داده‌ای برای دانلود وجود ندارد', 'warning');
                    return;
                }

                try {
                    // Prepare data with Persian headers
                    const exportData = history.map(item => ({
                        'تاریخ': new Date(item.date).toLocaleDateString('fa-IR'),
                        'نوع تراکنش': item.type,
                        'شرح': item.description,
                        'مبلغ (تومان)': item.amount,
                        'مانده (تومان)': item.runningBalance
                    }));

                    // Create worksheet
                    const ws = XLSX.utils.json_to_sheet(exportData);
                    
                    // Adjust column widths (optional but good)
                    const wscols = [
                        {wch: 15}, // Date
                        {wch: 25}, // Type
                        {wch: 40}, // Description
                        {wch: 15}, // Amount
                        {wch: 15}  // Balance
                    ];
                    ws['!cols'] = wscols;

                    // Create workbook
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Statement");

                    // Generate file
                    // Sanitize customer name for filename
                    const safeName = customerName ? customerName.replace(/\s+/g, '_') : 'User';
                    const fileName = `Statement_${safeName}_${new Date().toLocaleDateString('fa-IR').replace(/\//g, '-')}.xlsx`;
                    
                    XLSX.writeFile(wb, fileName);
                    
                    addToast('فایل اکسل با موفقیت دانلود شد', 'success');
                } catch (err) {
                    console.error('Export failed:', err);
                    addToast('خطا در ایجاد فایل اکسل', 'error');
                }
            };

            const finalBalance = history.length > 0 ? history[history.length - 1].runningBalance : 0;
            const balanceClass = finalBalance < 0 
                ? 'bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300' 
                : (finalBalance > 0 ? 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300' : 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300');
            
            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`صورتحساب - ${customerName}`}>
                    <div className="text-right space-y-4">
                        <div className={`p-3 rounded-lg text-lg font-bold ${balanceClass}`}>
                            مانده نهایی حساب: <span dir="ltr">{formatCurrency(finalBalance)}</span> تومان
                        </div>
                        
                        {isLoading ? <div className="spinner"></div> : history.length === 0 ? (
                            <p className="text-center p-4 text-gray-500">هیچ تراکنش مالی برای این کاربر ثبت نشده است.</p>
                        ) : (
                            <div className="overflow-x-auto max-h-[60vh] border rounded-lg dark:border-gray-700">
                                <table className="w-full text-right text-sm min-w-[600px]">
                                    <thead className="sticky top-0 bg-gray-100 dark:bg-gray-700 border-b dark:border-gray-600">
                                        <tr>
                                            <th className="p-3">تاریخ</th>
                                            <th className="p-3">شرح</th>
                                            <th className="p-3">مبلغ (بدهکار/بستانکار)</th>
                                            <th className="p-3">مانده</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {history.map((item, index) => (
                                            <tr key={item.date + index} className="border-b dark:border-gray-700 last:border-b-0 hover:bg-gray-50 dark:hover:bg-gray-700/50">
                                                <td className="p-3 whitespace-nowrap">{new Date(item.date).toLocaleDateString('fa-IR')}</td>
                                                <td className="p-3">
                                                    <div className="font-medium">{item.type}</div>
                                                    <div className="text-xs text-gray-500 dark:text-gray-400 mt-1">{item.description}</div>
                                                </td>
                                                <td className={`p-3 font-mono ${item.amount < 0 ? 'text-red-500' : 'text-green-500'}`} dir="ltr">{formatCurrency(Math.abs(item.amount))}</td>
                                                <td className={`p-3 font-bold ${item.runningBalance < 0 ? 'text-red-500' : 'text-green-500'}`} dir="ltr">{formatCurrency(item.runningBalance)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                    <div className="flex justify-end mt-4 gap-3">
                        <button onClick={onClose} className="bg-gray-200 dark:bg-gray-600 py-2 px-5 rounded-lg font-semibold">بستن</button>
                        <button onClick={handleDownloadExcel} className="bg-indigo-600 text-white py-2 px-5 rounded-lg font-semibold hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled={history.length === 0}>
                            دانلود اکسل
                        </button>
                    </div>
                </Modal>
            );
        };

        const PaymentAllocationModal = ({ isOpen, onClose, onSave, preInvoiceData }) => {
            const [totalAmountReceived, setTotalAmountReceived] = React.useState(0);
            const [allocations, setAllocations] = React.useState([]);
            const [users, setUsers] = React.useState([]);
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            const { addToast } = useToasts();
            const [searchTerm, setSearchTerm] = React.useState(''); 

            React.useEffect(() => {
                if (preInvoiceData) {
                    setTotalAmountReceived(preInvoiceData.totalAmount);
                    const initialAllocations = Object.values(preInvoiceData.suppliers).map(supplier => ({
                        userId: supplier.id,
                        amount: '',
                        key: Math.random()
                    }));
                    setAllocations(initialAllocations);
                }
            }, [preInvoiceData]);

            React.useEffect(() => {
                const fetchUsers = async () => {
                    const { data, error } = await supabaseClient
                        .from('profiles')
                        .select('id, fullname, roleid')
                        .in('roleid', [1, 3]); // Fetch Admin (1) and Supplier (3)
                    if (error) {
                        console.error("Error fetching users:", error);
                        addToast('خطا در بارگذاری لیست کاربران', 'error');
                    } else {
                        setUsers(data || []);
                    }
                };
                fetchUsers();
            }, []);
            
            const totalAllocated = React.useMemo(() =>
                allocations.reduce((sum, alloc) => sum + parseFormattedNumber(alloc.amount), 0),
                [allocations]
            );

            const remainingAmount = parseFormattedNumber(totalAmountReceived) - totalAllocated;

            const selectedUserIds = React.useMemo(() =>
                new Set(allocations.map(a => a.userId).filter(Boolean)),
                [allocations]
            );


            const handleAllocationChange = (index, field, value) => {
                const newAllocations = [...allocations];
                if (field === 'amount') {
                    newAllocations[index][field] = formatNumberWithCommas(value);
                } else {
                    newAllocations[index][field] = value;
                }
                setAllocations(newAllocations);
            };

            const addAllocationRow = () => {
                setAllocations([...allocations, { userId: '', amount: '', key: Math.random() }]);
            };

            const removeAllocationRow = (index) => {
                const newAllocations = allocations.filter((_, i) => i !== index);
                setAllocations(newAllocations);
            };
            
            const handleSave = async () => {
                const parsedTotalReceived = parseFormattedNumber(totalAmountReceived);
                if (totalAllocated > parsedTotalReceived) {
                    addToast('مبلغ تخصیص‌داده شده بیشتر از مبلغ دریافتی است!', 'warning');
                    return; 
                }
                
                const finalAllocations = allocations
                    .map(a => ({...a, amount: parseFormattedNumber(a.amount)}))
                    .filter(a => a.userId && a.amount > 0);

                if (finalAllocations.length === 0) {
                    addToast("لطفا حداقل یک تخصیص پرداخت معتبر وارد کنید.", 'error');
                    return;
                }

                setIsSubmitting(true);
                try {
                    await onSave({
                        totalAmountReceived: parsedTotalReceived,
                        allocations: finalAllocations,
                        preInvoiceData
                    });
                } catch (error) {
                    // Error is handled in the parent component
                } finally {
                    setIsSubmitting(false);
                }
            };

            const filteredUsers = React.useMemo(() => 
                users.filter(user => 
                    user.fullname.toLowerCase().includes(searchTerm.toLowerCase())
                ), 
                [users, searchTerm]
            );

            if (!preInvoiceData) return null;

            return (
                <Modal isOpen={isOpen} onClose={onClose} title="ثبت و تخصیص پرداخت">
                    <div className="space-y-4">
                        <div>
                            <label className="block font-semibold mb-2">مبلغ کل دریافت شده از مشتری</label>
                            <input
                                type="text"
                                value={formatNumberWithCommas(totalAmountReceived)}
                                onChange={e => setTotalAmountReceived(e.target.value)}
                                className="w-full bg-gray-100 dark:bg-gray-700 p-2 rounded-md text-center text-lg font-bold"
                                dir="ltr"
                            />
                        </div>
                        
                        <div className="flex flex-col sm:flex-row justify-between items-center bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg text-sm gap-2">
                            <div dir="rtl">
                                <span className="text-gray-600 dark:text-gray-300">مبلغ تخصیص داده شده: </span>
                                <span className="font-bold" dir="ltr">{formatCurrency(totalAllocated)}</span>
                            </div>
                            <div className={`font-bold ${remainingAmount < 0 ? 'text-red-500' : 'text-green-500'}`} dir="rtl">
                                <span className="text-gray-600 dark:text-gray-300">مبلغ باقی‌مانده: </span>

        const EditInvoiceModal = ({ isOpen, onClose, onSave, invoice: initialInvoice, addToast }) => {
            const [invoice, setInvoice] = React.useState(initialInvoice);
            const [isSubmitting, setIsSubmitting] = React.useState(false);

            React.useEffect(() => {
                if (initialInvoice) {
                    const loadedInvoice = JSON.parse(JSON.stringify(initialInvoice));
                    const totalHeaderShipping = loadedInvoice.totalshippingprice || 0;
                    const totalItemShipping = loadedInvoice.demandinvoicedetail.reduce((sum, item) => sum + (item.shippingprice || 0), 0);

                    // Logic to distribute shipping if it was only set at the header level initially
                    if (totalHeaderShipping > 0 && totalItemShipping === 0 && loadedInvoice.demandinvoicedetail.length > 0) {
                        const count = loadedInvoice.demandinvoicedetail.length;
                        const baseShipping = Math.floor(totalHeaderShipping / count);
                        let remainder = totalHeaderShipping % count;

                        loadedInvoice.demandinvoicedetail.forEach(detail => {
                            let alloc = baseShipping;
                            if (remainder > 0) {
                                alloc += 1;
                                remainder--;
                            }
                            detail.shippingprice = alloc;
                        });
                    }
                    setInvoice(loadedInvoice);
                }
            }, [initialInvoice]);

            if (!invoice) return null;

            const recalculateTotal = (updatedInvoice) => {
                const subtotal = updatedInvoice.demandinvoicedetail.reduce((sum, item) => sum + (item.quantity * item.sales_price), 0);
                const discount = updatedInvoice.discount || 0;
                const shipping = updatedInvoice.demandinvoicedetail.reduce((sum, item) => sum + (item.shippingprice || 0), 0);
                return { total: subtotal - discount + shipping, totalShipping: shipping };
            };

            const handlePriceChange = (detailId, newPrice) => {
                setInvoice(prev => {
                    const updatedDetails = prev.demandinvoicedetail.map(detail => {
                        if (detail.id === detailId) {
                            return { ...detail, sales_price: parseFormattedNumber(newPrice) };
                        }
                        return detail;
                    });
                    const newInvoice = { ...prev, demandinvoicedetail: updatedDetails };
                    const { total, totalShipping } = recalculateTotal(newInvoice);
                    return { ...newInvoice, totalamount: total, totalshippingprice: totalShipping };
                });
            };

            const handleShippingChange = (detailId, newShipping) => {
                setInvoice(prev => {
                    const updatedDetails = prev.demandinvoicedetail.map(detail => {
                        if (detail.id === detailId) {
                            return { ...detail, shippingprice: parseFormattedNumber(newShipping) };
                        }
                        return detail;
                    });
                    const newInvoice = { ...prev, demandinvoicedetail: updatedDetails };
                    const { total, totalShipping } = recalculateTotal(newInvoice);
                    return { ...newInvoice, totalamount: total, totalshippingprice: totalShipping };
                });
            };

            const handleInputChange = (field, value) => {
                setInvoice(prev => {
                    const newInvoice = { ...prev };
                    if (field === 'note') {
                        newInvoice.note = value;
                    } else {
                        newInvoice[field] = parseFormattedNumber(value);
                    }
                    const { total } = recalculateTotal(newInvoice);
                    return { ...newInvoice, totalamount: total };
                });
            };

            const handleSave = async () => {
                setIsSubmitting(true);
                try {
                    // Update invoice details first
                    const detailUpdates = invoice.demandinvoicedetail.map(detail => 
                        supabaseClient
                            .from('demandinvoicedetail')
                            .update({ 
                                sales_price: detail.sales_price,
                                shippingprice: detail.shippingprice 
                            })
                            .eq('id', detail.id)
                    );
                    const detailResults = await Promise.all(detailUpdates);
                    const firstDetailError = detailResults.find(res => res.error);
                    if (firstDetailError) throw firstDetailError.error;

                    // Update invoice header
                    const { error: invoiceUpdateError } = await supabaseClient
                        .from('demandinvoice')
                        .update({ 
                            totalamount: invoice.totalamount,
                            discount: invoice.discount || 0,
                            totalshippingprice: invoice.totalshippingprice,
                            note: invoice.note || ''
                        })
                        .eq('id', invoice.id);
                    
                    if (invoiceUpdateError) throw invoiceUpdateError;
                    
                    addToast('فاکتور با موفقیت به‌روزرسانی شد!', 'success');
                    onSave();
                } catch (err) {
                    console.error("Error updating invoice:", err);
                    addToast(`خطا در به‌روزرسانی فاکتور: ${err.message}`, 'error');
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`ویرایش فاکتور شماره ${invoice.id}`}>
                    <div className="space-y-4">
                        <div className="overflow-x-auto">
                           <table className="w-full text-right min-w-[500px]">
                                <thead>
                                    <tr>
                                        <th className="p-2">محصول</th>
                                        <th className="p-2">تعداد</th>
                                        <th className="p-2">قیمت فروش</th>
                                        <th className="p-2">هزینه ارسال</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {invoice.demandinvoicedetail.map(detail => (
                                        <tr key={detail.id}>
                                            <td className="p-2">{detail.product?.title || 'نامشخص'}</td>
                                            <td className="p-2">{detail.quantity}</td>
                                            <td className="p-2">
                                                <input
                                                    type="text"
                                                    value={formatNumberWithCommas(detail.sales_price)}
                                                    onChange={e => handlePriceChange(detail.id, e.target.value)}
                                                    className="w-28 bg-gray-100 dark:bg-gray-700 p-1 rounded-md text-center"
                                                    dir="ltr"
                                                />
                                            </td>
                                            <td className="p-2">
                                                <input
                                                    type="text"
                                                    value={formatNumberWithCommas(detail.shippingprice)}
                                                    onChange={e => handleShippingChange(detail.id, e.target.value)}
                                                    className="w-28 bg-gray-100 dark:bg-gray-700 p-1 rounded-md text-center"
                                                    dir="ltr"
                                                />
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">تخفیف (تومان)</label>
                                <input
                                    type="text"
                                    placeholder="0"
                                    value={formatNumberWithCommas(invoice.discount)}
                                    onChange={e => handleInputChange('discount', e.target.value)}
                                    className="w-full bg-gray-100 dark:bg-gray-700 p-2 rounded-md text-center"
                                    dir="ltr"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">جمع کل هزینه ارسال (تومان)</label>
                                <input
                                    type="text"
                                    value={formatNumberWithCommas(invoice.totalshippingprice)}
                                    readOnly
                                    disabled
                                    className="w-full bg-gray-200 dark:bg-gray-600 p-2 rounded-md text-center cursor-not-allowed"
                                    dir="ltr"
                                />
                                <span className="text-xs text-gray-500 dark:text-gray-400 mt-1 block">محاسبه خودکار از جمع هزینه ارسال اقلام</span>
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">یادداشت</label>
                                <textarea
                                    value={invoice.note || ''}
                                    onChange={e => handleInputChange('note', e.target.value)}
                                    rows="3"
                                    placeholder="توضیحات مربوط به فاکتور..."
                                    className="w-full bg-gray-100 dark:bg-gray-700 p-2 rounded-md"
                                ></textarea>
                            </div>
                        </div>

                        <div className="text-left font-bold text-lg mt-2">
                            مبلغ کل جدید: <span dir="ltr">{formatCurrency(invoice.totalamount)}</span> تومان
                        </div>
                        <div className="flex flex-col sm:flex-row justify-end gap-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                            <button onClick={onClose} className="w-full sm:w-auto bg-gray-200 dark:bg-gray-600 py-2 px-4 rounded-lg">انصراف</button>
                            <button onClick={handleSave} disabled={isSubmitting} className="w-full sm:w-auto bg-indigo-600 text-white py-2 px-4 rounded-lg disabled:bg-indigo-400">
                                {isSubmitting ? 'در حال ذخیره...' : 'ذخیره تغییرات'}
                            </button>
                        </div>
                    </div>
                </Modal>
            );
        };

        // Generic Printable Layout Component (No Change)

        const PrintablePreInvoice = ({ preInvoiceData, onClose, customerBalance }) => {
            const [sellerProfile, setSellerProfile] = React.useState(null);
            const [allSellers, setAllSellers] = React.useState([]);
            const [selectedSellerId, setSelectedSellerId] = React.useState(APP_CONFIG.DEFAULT_SELLER_ID);
            const [currency, setCurrency] = React.useState(APP_CONFIG.DEFAULT_CURRENCY);
            const [customerProfile, setCustomerProfile] = React.useState(null);

            React.useEffect(() => {
                const fetchAllSellers = async () => {
                    const { data, error } = await supabaseClient
                        .from('profiles')
                        .select('id, fullname')
                        .eq('roleid', 1);
                    if (error) console.error('Error fetching admin sellers:', error);
                    else setAllSellers(data || []);
                };
                fetchAllSellers();
            }, []);

            React.useEffect(() => {
                if (!selectedSellerId) return;
                const fetchSellerProfile = async () => {
                    const { data, error } = await supabaseClient
                        .from('profiles')
                        .select('id, fullname, national_id, mobile, location:locationid(postalcode, address, plaque)')
                        .eq('id', selectedSellerId)
                        .single();

                        console.error('Error fetching seller profile:', error);

                    } else {
                        setSellerProfile(data);
                    }
                };
                fetchSellerProfile();
            }, [selectedSellerId]);

            React.useEffect(() => {
                if (!preInvoiceData?.customerId) return;

                        .from('profiles')
                        .select('id, fullname, national_id, mobile, location:locationid(postalcode, address, plaque)')
                        .eq('id', preInvoiceData.customerId)
                        .single();

        // ==================================================
        // Invoice Management Component
        // ==================================================
        const InvoiceManagement = () => {
            const [preInvoices, setPreInvoices] = React.useState({});
            const [invoices, setInvoices] = React.useState([]);
            const [allFilteredInvoices, setAllFilteredInvoices] = React.useState([]); // New: Store all invoices for client-side pagination
            const [transactions, setTransactions] = React.useState([]); 
            const [suppliers, setSuppliers] = React.useState([]); // NEW: State for suppliers
            const [isLoading, setIsLoading] = React.useState(true);
            const [error, setError] = React.useState('');
            const [isSubmitting, setIsSubmitting] = React.useState(null);
            const [allocationModalState, setAllocationModalState] = React.useState({ isOpen: false, preInvoiceData: null });
            const [activeTab, setActiveTab] = React.useState('pending');
            const [editingInvoice, setEditingInvoice] = React.useState(null);
            const [printingInvoice, setPrintingInvoice] = React.useState(null);
            const [printingPreInvoice, setPrintingPreInvoice] = React.useState(null);
            const [customerBalances, setCustomerBalances] = React.useState({}); 
            const [statementModalState, setStatementModalState] = React.useState({ isOpen: false, customerId: null, customerName: '' }); 
            const [deleteModalState, setDeleteModalState] = React.useState({ isOpen: false, invoiceToDelete: null }); // NEW: Delete state
            const { addToast } = useToasts();
            
            // --- Search & Pagination State ---
            const [currentPage, setCurrentPage] = React.useState(0);
            const [invoicesPerPage] = React.useState(10);
            const [totalInvoices, setTotalInvoices] = React.useState(0);
            const [totalTransactions, setTotalTransactions] = React.useState(0);
            const [searchQuery, setSearchQuery] = React.useState('');
            // --- Filter State ---
            const [showShippingOnly, setShowShippingOnly] = React.useState(false);
            const [showNonZeroBalanceOnly, setShowNonZeroBalanceOnly] = React.useState(false);

            // Helper: Fetch Global Balances efficiently
            const fetchGlobalBalances = async () => {
                try {
                    // 1. Get all transactions (credits)
                    const { data: allTx, error: txError } = await supabaseClient
                        .from('usertransaction')
                        .select('userid, amount');
                    if (txError) throw txError;

                    // 2. Get all invoice totals (debits)
                    const { data: allInv, error: invError } = await supabaseClient
                        .from('demandinvoice')
                        .select('customeruserid, totalamount');
                    if (invError) throw invError;

                    // 3. Aggregate in memory
                    const balanceMap = {};

                    // Sum Credits (Positive amount transactions)
                    allTx.forEach(tx => {
                        if (!tx.userid) return;
                        balanceMap[tx.userid] = (balanceMap[tx.userid] || 0) + (tx.amount || 0);
                    });

                    // Subtract Debits (Invoice total is considered a debit for the customer)
                    allInv.forEach(inv => {
                        if (!inv.customeruserid) return;
                        // Note: Customer balance is (Payments - Invoices). Invoices are negative.
                        balanceMap[inv.customeruserid] = (balanceMap[inv.customeruserid] || 0) - (inv.totalamount || 0);
                    });

                    setCustomerBalances(balanceMap);
                    return balanceMap;
                } catch (err) {
                    console.error("Error fetching global balances:", err);
                    return {};
                }
            };

            // Fetch balances for specific users (Legacy/Single page mode)
            const fetchBalancesForUsers = async (userIds) => {
                const uniqueIds = [...new Set(userIds)].filter(id => customerBalances[id] === undefined);
                if (uniqueIds.length === 0) return;

                const newBalances = {};
                await Promise.all(uniqueIds.map(async (uid) => {
                    const balance = await fetchUserBalance(uid);
                    newBalances[uid] = balance;
                }));
                setCustomerBalances(prev => ({ ...prev, ...newBalances }));
            };

            // NEW: Fetch Suppliers Data
            const fetchSuppliersData = async () => {
                setIsLoading(true);
                setError('');
                try {
                    // 1. Fetch Suppliers (Role ID 3)
                    const { data: profiles, error: profileError } = await supabaseClient
                        .from('profiles')
                        .select('id, fullname, mobile, national_id')
                        .eq('roleid', 3);
                    
                    if (profileError) throw profileError;

                    if (!profiles || profiles.length === 0) {
                        setSuppliers([]);
                        setIsLoading(false);
                        return;
                    }

                    const supplierIds = profiles.map(p => p.id);

                    // 2. Fetch Transactions for these suppliers
                    const { data: txs, error: txError } = await supabaseClient
                        .from('usertransaction')
                        .select('userid, amount')
                        .in('userid', supplierIds);
                        
                    if (txError) throw txError;

                    // 3. Fetch Invoices where they might be customers (to calculate correct balance)
                    const { data: invs, error: invError } = await supabaseClient
                        .from('demandinvoice')
                        .select('customeruserid, totalamount')
                        .in('customeruserid', supplierIds);

                    if (invError) throw invError;

                    // 4. Aggregate Balance and Payouts
                    const stats = {};
                    supplierIds.forEach(id => stats[id] = { balance: 0, totalPayouts: 0 });

                    // Sum Transactions
                    (txs || []).forEach(tx => {
                        if (stats[tx.userid]) {
                            stats[tx.userid].balance += (tx.amount || 0);
                            // Assuming negative transaction for supplier is a Payout
                            if ((tx.amount || 0) < 0) {
                                stats[tx.userid].totalPayouts += Math.abs(tx.amount);
                            }
                        }
                    });

                    // Subtract Invoices (if any)
                    (invs || []).forEach(inv => {
                        if (stats[inv.customeruserid]) {
                            stats[inv.customeruserid].balance -= (inv.totalamount || 0);
                        }
                    });

                    // 5. Merge data
                    const result = profiles.map(p => ({
                        ...p,
                        balance: stats[p.id].balance,
                        totalPayouts: stats[p.id].totalPayouts
                    }));

                    setSuppliers(result);

                } catch (err) {
                    console.error("Error fetching suppliers:", err);
                    setError(`خطا در بارگذاری تامین‌کنندگان: ${err.message}`);
                } finally {
                    setIsLoading(false);
                }
            };

            // New: Fetch Transaction Data
            const fetchTransactionData = async () => {
                setIsLoading(true);
                setError('');
                try {
                    const from = currentPage * invoicesPerPage;
                    const to = from + invoicesPerPage - 1;

                    let queryBuilder = supabaseClient.from('usertransaction')
                        .select(`
                            *,
                            profile:userid(fullname),
                            invoice:demandinvoiceid(id)
                        `, { count: 'exact' });

                    if (searchQuery) {
                        if (!isNaN(searchQuery)) {
                            // Assume searching for invoice ID
                            queryBuilder = queryBuilder.eq('demandinvoiceid', searchQuery);
                        } else {
                            // Search by user name using !inner to filter joined table
                            queryBuilder = supabaseClient.from('usertransaction')
                                .select(`
                                    *,
                                    profile:userid!inner(fullname),
                                    invoice:demandinvoiceid(id)
                                `, { count: 'exact' })
                                .ilike('profile.fullname', `%${searchQuery}%`);
                        }
                    }

                    const { data, error, count } = await queryBuilder
                        .order('createdat', { ascending: false })
                        .range(from, to);

                    if (error) throw error;
                    setTransactions(data || []);
                    setTotalTransactions(count || 0);
                } catch (err) {
                    console.error("Error fetching transactions:", err);
                    setError(`خطا در بارگذاری تراکنش‌ها: ${err.message}`);
                } finally {
                    setIsLoading(false);
                }
            };

            const fetchPendingData = async () => {
                setIsLoading(true);
                setError('');
                try {
                    const { data: pendingData, error: rpcError } = await supabaseClient.rpc('get_items_for_invoicing');
                    if (rpcError) throw rpcError;
                    
                    const groupedByCustomer = (pendingData || []).reduce((acc, rpcRow) => {
                        const customerId = rpcRow.customer_id;
                        if (!customerId) return acc;
                        if (!acc[customerId]) {
                            acc[customerId] = {
                                customerId: rpcRow.customer_id,
                                customerName: rpcRow.customer_name || 'مشتری نامشخص',
                                demandid: rpcRow.demandid, 
                                items: {}, 
                                suppliers: {},
                                totalAmount: 0,
                                shipping: 0,
                                discount: 0
                            };
                        }
                        const itemId = rpcRow.item_id;
                        if (!acc[customerId].items[itemId]) {
                            // Calculate a default sale price with 10% markup, or use existing if available
                            const sale_price = rpcRow.sale_price || (rpcRow.approved_supply_price ? Math.round(rpcRow.approved_supply_price * 1.10) : 0);
                            const subtotal = (rpcRow.approved_supply_quantity || 0) * sale_price;
                            acc[customerId].items[itemId] = {
                                id: itemId,
                                product: { title: rpcRow.product_name },
                                approved_supply_quantity: rpcRow.approved_supply_quantity,
                                sale_price,
                                shipping_price: 0,
                                subtotal
                            };
                            acc[customerId].totalAmount += subtotal;
                        }
                        const supplierId = rpcRow.supplier_id;
                        if (supplierId && !acc[customerId].suppliers[supplierId]) {
                            acc[customerId].suppliers[supplierId] = { id: supplierId, name: rpcRow.supplier_name };
                        }
                        return acc;
                    }, {});

                    Object.keys(groupedByCustomer).forEach(customerId => {
                        groupedByCustomer[customerId].items = Object.values(groupedByCustomer[customerId].items);
                    });
                    setPreInvoices(groupedByCustomer);

                    // Fetch balances for these customers
                    const customerIds = Object.keys(groupedByCustomer);
                    if (customerIds.length > 0) {
                        fetchBalancesForUsers(customerIds);
                    }

                } catch (err) {
                        console.error("Error fetching pending invoice data:", err);
                        setError(`خطا در بارگذاری اطلاعات آماده صدور: ${err.message}.`);
                        addToast(`خطا در بارگذاری اطلاعات آماده صدور: ${err.message}`, 'error');
                } finally {
                    setIsLoading(false);
                }
            };
            
            const fetchHistoricalData = async () => {
                setIsLoading(true);
                setError('');
                try {
                    // Branch 1: If filtering by Non-Zero Balance, fetch global data (Client-side pagination)
                    if (showNonZeroBalanceOnly) {
                        const balanceMap = await fetchGlobalBalances();

                        let queryBuilder = supabaseClient.from('demandinvoice')
                            .select(`
                                *, 
                                demandinvoicedetail(*, profiles:supplieruserid(fullname), demand_item:demand_item_id(product(title)), location:locationid(postalcode)),
                                customer:customeruserid(id, fullname, national_id, mobile, location:locationid(postalcode, address, plaque))
                            `)
                            .order('createdat', { ascending: false })
                            .limit(1000); 

                        if (showShippingOnly) {
                            queryBuilder = queryBuilder.gt('totalshippingprice', 0);
                        }

                        const { data: allData, error: loadError } = await queryBuilder;
                        if (loadError) throw loadError;

                        // Filter In Memory based on Balance Map AND Unique Customer
                        const seenCustomers = new Set();
                        const uniqueFiltered = [];
                        
                        // Filter the returned invoices to only include the *latest* invoice for customers with a non-zero balance
                        (allData || []).forEach(inv => {
                            const customerId = inv.customeruserid;
                            const bal = balanceMap[customerId];
                            
                            // Check if balance is non-zero
                            if (bal !== 0 && bal !== undefined) {
                                // Check if we haven't seen this customer yet (to show only one row per customer with non-zero balance)
                                if (!seenCustomers.has(customerId)) {
                                    seenCustomers.add(customerId);
                                    uniqueFiltered.push(inv);
                                }
                            }
                        });

                        setAllFilteredInvoices(uniqueFiltered);
                        setTotalInvoices(uniqueFiltered.length);
                        
                        // Slice for current page
                        const from = currentPage * invoicesPerPage;
                        const to = from + invoicesPerPage;
                        setInvoices(uniqueFiltered.slice(from, to));

                    } 
                    // Branch 2: Standard Server-Side Pagination
                    else {
                        const from = currentPage * invoicesPerPage;
                        const to = from + invoicesPerPage - 1;

                        let queryBuilder = supabaseClient.from('demandinvoice');
                        
                        let selectString = `
                                *, 
                                demandinvoicedetail(*, profiles:supplieruserid(fullname), demand_item:demand_item_id(product(title)), location:locationid(postalcode))
                        `;

                        // Decide on select string based on whether we need the inner join for search
                        if (searchQuery && !(!isNaN(searchQuery) && !isNaN(parseFloat(searchQuery)))) {
                            // Search by name requires inner join
                            selectString += `, customer:customeruserid!inner(id, fullname, national_id, mobile, location:locationid(postalcode, address, plaque))`;
                            queryBuilder = queryBuilder.select(selectString, { count: 'exact' }).ilike('customer.fullname', `%${searchQuery}%`);
                        } else {
                            // Search by ID or no search, use regular select
                            selectString += `, customer:customeruserid(id, fullname, national_id, mobile, location:locationid(postalcode, address, plaque))`;
                            queryBuilder = queryBuilder.select(selectString, { count: 'exact' });
                            if (searchQuery) { // Search by ID
                                queryBuilder = queryBuilder.eq('id', searchQuery);
                            }
                        }

                        if (showShippingOnly) {
                            queryBuilder = queryBuilder.gt('totalshippingprice', 0);
                        }

                        const { data: historicalData, error: historicalError, count } = await queryBuilder
                            .order('createdat', { ascending: false })
                            .range(from, to);
                            
                        if (historicalError) throw historicalError;
                        setInvoices(historicalData || []);
                        setTotalInvoices(count || 0);

                        // Fetch balances for just these visible users
                        if (historicalData && historicalData.length > 0) {
                            const customerIds = historicalData.map(inv => inv.customeruserid).filter(Boolean);
                            fetchBalancesForUsers(customerIds);
                        }
                    }

                } catch (err) {
                    console.error("Error fetching historical invoice data:", err);
                    setError(`خطا در بارگذاری تاریخچه: ${err.message}.`);
                    addToast(`خطا در بارگذاری تاریخچه: ${err.message}`, 'error');
                } finally {
                    setIsLoading(false);
                }
            }
            
            React.useEffect(() => {
                if (activeTab === 'pending') {
                    fetchPendingData();
                } else if (activeTab === 'transactions') {
                    fetchTransactionData();
                } else if (activeTab === 'suppliers') { // NEW
                    fetchSuppliersData();
                }
            }, [activeTab]); // Ensure deps are correct (removed [] to depend on activeTab change logic inside component if necessary, or keep logic consistent)
            
            // Re-run fetch when filters change
            React.useEffect(() => {
                if(activeTab === 'history') {
                    fetchHistoricalData();
                } else if (activeTab === 'transactions') {
                    fetchTransactionData();
                }
                // No specific filters for suppliers yet
            }, [activeTab, currentPage, searchQuery, showShippingOnly, showNonZeroBalanceOnly]); 
            
            const refreshData = async () => {
                setCustomerBalances({}); // Reset balances on full refresh
                setAllFilteredInvoices([]);
                if (activeTab === 'pending') {
                    await fetchPendingData();
                } else if (activeTab === 'transactions') {
                    if (currentPage !== 0) setCurrentPage(0);
                    else await fetchTransactionData();
                } else if (activeTab === 'suppliers') { // NEW
                    await fetchSuppliersData();
                } else {
                    if(currentPage !== 0) {
                        setCurrentPage(0); 
                    } else {
                        await fetchHistoricalData();
                    }
                }
            };

            const handleSearchChange = (e) => {
                setSearchQuery(e.target.value);
                setCurrentPage(0);
            };

            const handleFilterChange = (e) => {
                setShowShippingOnly(e.target.checked);
                setCurrentPage(0);
            };
            
            const handleBalanceFilterChange = (e) => {
                setShowNonZeroBalanceOnly(e.target.checked);
                setCurrentPage(0); // Reset to page 1 when mode changes
            };
            
            const recalculatePreInvoiceTotal = (invoice) => {
                const subtotal = invoice.items.reduce((sum, item) => sum + item.subtotal, 0);
                const discount = invoice.discount || 0;
                const shipping = invoice.items.reduce((sum, item) => sum + (item.shipping_price || 0), 0);
                return subtotal - discount + shipping;
            }

            const handlePreInvoiceMetaChange = (customerId, field, value) => {
                setPreInvoices(prev => {
                    const newInvoices = { ...prev };
                    const invoice = { ...newInvoices[customerId] };
                    invoice[field] = parseFormattedNumber(value);
                    invoice.totalAmount = recalculatePreInvoiceTotal(invoice);
                    newInvoices[customerId] = invoice;
                    return newInvoices;
                });
            }

            const handlePriceChange = (customerId, itemId, newPrice) => {
                setPreInvoices(prev => {
                    const newInvoices = { ...prev };
                    const invoice = { ...newInvoices[customerId] };
                    invoice.items = invoice.items.map(item => {
                        if (item.id === itemId) {
                            const price = parseFormattedNumber(newPrice);
                            return { ...item, sale_price: price, subtotal: (item.approved_supply_quantity || 0) * price };
                        }
                        return item;
                    });
                    invoice.totalAmount = recalculatePreInvoiceTotal(invoice);
                    newInvoices[customerId] = invoice;
                    return newInvoices;
                });
            };

            const handleItemShippingChange = (customerId, itemId, newShipping) => {
                setPreInvoices(prev => {
                    const newInvoices = { ...prev };
                    const invoice = { ...newInvoices[customerId] };
                    invoice.items = invoice.items.map(item => {
                        if (item.id === itemId) {
                            const shipping = parseFormattedNumber(newShipping);
                            return { ...item, shipping_price: shipping };
                        }
                        return item;
                    });
                    invoice.totalAmount = recalculatePreInvoiceTotal(invoice);
                    invoice.shipping = invoice.items.reduce((sum, item) => sum + (item.shipping_price || 0), 0);
                    newInvoices[customerId] = invoice;
                    return newInvoices;
                });
            };
            
            const handleQuantityChange = (customerId, itemId, newQuantity) => {
                setPreInvoices(prev => {
                    const newInvoices = { ...prev };
                    const invoice = { ...newInvoices[customerId] };
                    invoice.items = invoice.items.map(item => {
                        if (item.id === itemId) {
                            const quantity = parseFormattedNumber(newQuantity) || 0;
                            return { 
                                ...item, 
                                approved_supply_quantity: quantity, 
                                subtotal: quantity * (item.sale_price || 0) 
                            };
                        }
                        return item;
                    });
                    invoice.totalAmount = recalculatePreInvoiceTotal(invoice);
                    newInvoices[customerId] = invoice;
                    return newInvoices;
                });
            };

            const handleInitiatePayment = (customerId) => {
                setAllocationModalState({ isOpen: true, preInvoiceData: preInvoices[customerId] });
            };

            const handleSaveAllocationAndCreateInvoice = async ({ totalAmountReceived, allocations, preInvoiceData }) => {
                const { customerId, items, discount, demandid } = preInvoiceData;
                
                const totalShipping = items.reduce((sum, item) => sum + (item.shipping_price || 0), 0);

                setIsSubmitting(customerId);
                try {
                    // 1. Create Invoice Header
                    const totalQuantity = items.reduce((sum, item) => sum + (item.approved_supply_quantity || 0), 0);
                    const { data: invoiceHeader, error: headerError } = await supabaseClient
                        .from('demandinvoice')
                        .insert({ 
                            demandid: demandid, 
                            customeruserid: customerId, 
                            totalquantity: totalQuantity, 
                            paymentstatusid: 1, 
                            totalamount: preInvoiceData.totalAmount,
                            discount: discount || 0,
                            totalshippingprice: totalShipping
                        })
                        .select()
                        .single();
                    if (headerError) throw headerError;
                    
                    // 2. Create Invoice Details
                    const uniqueItems = Array.from(new Map(items.map(item => [item.id, item])).values());
                    const itemIds = uniqueItems.map(item => item.id);
                    const { data: allAssignments, error: assignmentError } = await supabaseClient
                        .from('supplier_demand_assignment')
                        .select('demand_item_id, supplieruserid')
                        .in('demand_item_id, itemIds');
                    if (assignmentError) throw assignmentError;

                    const invoiceDetails = uniqueItems.map(item => {
                        const assignment = allAssignments.find(a => a.demand_item_id === item.id);
                        return { 
                            demandinvoiceid: invoiceHeader.id, 
                            demand_item_id: item.id, 
                            quantity: item.approved_supply_quantity,
                            sales_price: item.sale_price,
                            shippingprice: item.shipping_price || 0,
                            supplieruserid: assignment ? assignment.supplieruserid : null
                        };
                    });

                    const { error: detailError } = await supabaseClient.from('demandinvoicedetail').insert(invoiceDetails);
                    if (detailError) throw detailError;

                    // 3. Create Payment Allocations/Transactions
                    const transactions = [];
                    // Customer Payment (Credit)
                    transactions.push({
                        userid: customerId,
                        amount: totalAmountReceived,
                        demandinvoiceid: invoiceHeader.id,
                        transactiontypeid: 1 // 'Customer Payment'
                    });
                    // Supplier Payouts (Debit)
                    allocations.forEach(alloc => {
                        transactions.push({
                            userid: alloc.userId,
                            amount: -Math.abs(alloc.amount), // Negative amount for payout (debit on company's ledger)
                            demandinvoiceid: invoiceHeader.id,
                            transactiontypeid: 2 // 'Supplier Payout'
                        });
                    });
                    
                    for (const transaction of transactions) {
                        const { error: transactionError } = await supabaseClient.from('usertransaction').insert(transaction);
                        if (transactionError) {
                            throw new Error(`Failed to save transaction for user ${transaction.userid}: ${transactionError.message}`);
                        }

                        supabaseClient
                            .from('demand_item')
                            .update({ 
                                approved_supply_quantity: item.approved_supply_quantity,
                                demandstatusid: PAID_AWAITING_SHIPMENT_STATUS_ID
                            })
                            .eq('id', item.id)
                    );
                    
                    const updateResults = await Promise.all(itemUpdates);
                    const firstUpdateError = updateResults.find(res => res.error);
                    if (firstUpdateError) throw firstUpdateError.error;

                    setAllocationModalState({ isOpen: false, preInvoiceData: null });
                    await fetchPendingData(); 
                    if (activeTab === 'history') await fetchHistoricalData(); 
                } catch (err) {
                    console.error("Error creating invoice and allocations:", err);
                    addToast(`خطا در ایجاد فاکتور: ${err.message}`, 'error');
                    throw err;
