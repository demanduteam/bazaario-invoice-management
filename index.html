                                                <div className="flex justify-between items-center mb-2 pb-2 border-b dark:border-gray-600">
                                                    <div>
                                                        <span className="text-sm text-gray-500 dark:text-gray-400">شماره فاکتور</span>
                                                        <p className="font-bold font-mono text-indigo-600 dark:text-indigo-400">{invoice.id}</p>
                                                    </div>
                                                    <div className="text-left">
                                                        <span className="text-sm text-gray-500 dark:text-gray-400">تاریخ</span>
                                                        <p className="font-semibold">{new Date(invoice.createdat).toLocaleDateString('fa-IR')}</p>
                                                    </div>
                                                </div>
                                                <div className="mb-3">
                                                    <span className="text-sm text-gray-500 dark:text-gray-400">مشتری</span>
                                                    <p className="font-semibold">{invoice.customer?.fullname || 'نامشخص'}</p>
                                                </div>
                                                <div className="mb-3">
                                                    <span className="text-sm text-gray-500 dark:text-gray-400">مانده حساب</span>
                                                    <p className={`font-semibold ${customerBalances[invoice.customeruserid] < 0 ? 'text-red-400' : 'text-green-400'}`} dir="ltr">
                                                             {customerBalances[invoice.customeruserid] !== undefined ? `${formatCurrency(customerBalances[invoice.customeruserid])} تومان` : '...'}
                                                    </p>
                                                </div>
                                                <div className="mb-4">
                                                    <span className="text-sm text-gray-500 dark:text-gray-400">مبلغ کل</span>
                                                    <p className="font-bold text-lg" dir="ltr">{formatCurrency(invoice.totalamount)} تومان</p>
                                                </div>
                                                <div className="flex justify-end gap-4 border-t dark:border-gray-600 pt-3">
                                                    <button onClick={() => handleOpenEditModal(invoice)} className="text-indigo-500 hover:text-indigo-700 font-semibold text-sm">ویرایش</button>
                                                    <button onClick={() => handleOpenPrintModal(invoice)} className="text-green-500 hover:text-green-700 font-semibold text-sm">چاپ</button>
                                                    <button onClick={() => handleOpenStatementModal(invoice.customeruserid, invoice.customer?.fullname || 'نامشخص')} className="text-purple-500 hover:text-purple-700 font-semibold text-sm">صورتحساب</button>
                                                    <button onClick={() => handleOpenDeleteModal(invoice)} className="text-red-500 hover:text-red-700 font-semibold text-sm">حذف</button> {/* NEW DELETE BUTTON */}
                                                </div>
                                            </div>
                                        )) : (
                                            <p className="p-8 text-center text-gray-500">هیچ فاکتوری یافت نشد.</p>
                                        )}
                                    </div>

                                    {/* --- Pagination Controls --- */}
                                    {totalInvoices > 0 && (
                                        <div className="flex justify-between items-center mt-4 p-2">
                                            <button 
                                                onClick={prevPage} 
                                                disabled={currentPage === 0 || isLoading}
                                                className="bg-gray-200 dark:bg-gray-600 py-2 px-4 rounded-lg font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
                                            >
                                                قبلی
                                            </button>
                                            <span className="text-sm text-gray-700 dark:text-gray-300">
                                                صفحه {currentPage + 1} از {Math.ceil(totalInvoices / invoicesPerPage) || 1}
                                            </span>
                                            <button 
                                                onClick={nextPage} 
                                                disabled={(currentPage + 1) * invoicesPerPage >= totalInvoices || isLoading}
                                                className="bg-gray-200 dark:bg-gray-600 py-2 px-4 rounded-lg font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
                                            >
                                                بعدی
                                            </button>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    )}

                    {/* New Transaction Log Tab Content */}
                    {activeTab === 'transactions' && (
                        <div className="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                            <div className="mb-4">
                                <label htmlFor="trans-search" className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">جستجو تراکنش</label>
                                <div className="relative">
                                    <input
                                        id="trans-search"
                                        type="text"
                                        placeholder="جستجو بر اساس نام کاربر یا شماره فاکتور..."
                                        value={searchQuery}
                                        onChange={handleSearchChange}
                                        className="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg py-2 px-4 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                    />
                                    {searchQuery && (
                                        <button 
                                            onClick={() => { setSearchQuery(''); setCurrentPage(0); }}
                                            className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                        >
                                            &times;
                                        </button>
                                    )}
                                </div>
                            </div>

                            {isLoading && <div className="spinner"></div>}
                            {error && <p className="text-center p-8 text-red-500 bg-red-100 dark:bg-red-900/50 rounded-lg">{error}</p>}

                            {!isLoading && !error && (
                                <>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-right min-w-[600px]">
                                            <thead>
                                                <tr className="border-b dark:border-gray-700">
                                                    <th className="p-3 font-semibold">شناسه</th>
                                                    <th className="p-3 font-semibold">کاربر / تامین‌کننده</th>
                                                    <th className="p-3 font-semibold">نوع</th>
                                                    <th className="p-3 font-semibold">مبلغ</th>
                                                    <th className="p-3 font-semibold">شماره فاکتور</th>
                                                    <th className="p-3 font-semibold">تاریخ</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {transactions.length > 0 ? transactions.map(tx => (
                                                    <tr key={tx.id} className="border-b dark:border-gray-700 last:border-b-0 hover:bg-gray-50 dark:hover:bg-gray-700/50">
                                                        <td className="p-3 font-mono text-sm">{tx.id}</td>
                                                        <td className="p-3 font-medium">{tx.profile?.fullname || 'نامشخص'}</td>
                                                        <td className="p-3 text-sm text-gray-500">
                                                            {tx.transactiontypeid === 1 ? 'دریافت از مشتری' : 
                                                            tx.transactiontypeid === 2 ? 'پرداخت به تامین‌کننده' : 'تراکنش'}
                                                        </td>
                                                        <td className={`p-3 font-bold ${tx.amount > 0 ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}`} dir="ltr">
                                                            {formatCurrency(tx.amount)}
                                                        </td>
                                                        <td className="p-3 font-mono">{tx.invoice?.id || '-'}</td>
                                                        <td className="p-3 text-sm">{new Date(tx.createdat).toLocaleDateString('fa-IR')}</td>
                                                    </tr>
                                                )) : (
                                                    <tr>
                                                        <td colSpan="6" className="p-8 text-center text-gray-500">هیچ تراکنشی یافت نشد.</td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                    {/* Pagination for transactions */}
                                    {totalTransactions > 0 && (
                                        <div className="flex justify-between items-center mt-4 p-2">
                                            <button 
                                                onClick={prevPage} 
                                                disabled={currentPage === 0 || isLoading}
                                                className="bg-gray-200 dark:bg-gray-600 py-2 px-4 rounded-lg font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
                                            >
                                                قبلی
                                            </button>
                                            <span className="text-sm text-gray-700 dark:text-gray-300">
                                                صفحه {currentPage + 1} از {Math.ceil(totalTransactions / invoicesPerPage) || 1}
                                            </span>
                                            <button 
                                                onClick={nextPage} 
                                                disabled={(currentPage + 1) * invoicesPerPage >= totalTransactions || isLoading}
                                                className="bg-gray-200 dark:bg-gray-600 py-2 px-4 rounded-lg font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
                                            >
                                                بعدی
                                            </button>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    )}

                    {/* NEW: Suppliers Tab Content */}
                    {activeTab === 'suppliers' && (
                        <div className="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                            <h2 className="text-lg font-bold mb-4">لیست تامین‌کنندگان و وضعیت حساب</h2>
                            
                            <div className="mb-4">
                                <label htmlFor="supplier-search" className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">جستجو تامین‌کننده</label>
                                <div className="relative">
                                    <input
                                        id="supplier-search"
                                        type="text"
                                        placeholder="جستجو بر اساس نام..."
                                        value={searchQuery}
                                        onChange={handleSearchChange}
                                        className="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg py-2 px-4 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                    />
                                    {searchQuery && (
                                        <button 
                                            onClick={() => { setSearchQuery(''); }}
                                            className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                        >
                                            &times;
                                        </button>
                                    )}
                                </div>
                            </div>

                            {isLoading && <div className="spinner"></div>}
                            {error && <p className="text-center p-8 text-red-500 bg-red-100 dark:bg-red-900/50 rounded-lg">{error}</p>}

                            {!isLoading && !error && (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-right min-w-[600px]">
                                        <thead>
                                            <tr className="border-b dark:border-gray-700">
                                                <th className="p-3 font-semibold">نام تامین‌کننده</th>
                                                <th className="p-3 font-semibold">شماره تماس</th>
                                                <th className="p-3 font-semibold">کل پرداختی‌ها (برداشت)</th>
                                                <th className="p-3 font-semibold">مانده حساب جاری</th>
                                                <th className="p-3 font-semibold">عملیات</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {suppliers
                                                .filter(s => (s.fullname || '').toLowerCase().includes(searchQuery.toLowerCase()))
                                                .length > 0 ? 
                                                suppliers
                                                .filter(s => (s.fullname || '').toLowerCase().includes(searchQuery.toLowerCase()))
                                                .map(supplier => (
                                                <tr key={supplier.id} className="border-b dark:border-gray-700 last:border-b-0 hover:bg-gray-50 dark:hover:bg-gray-700/50">
                                                    <td className="p-3 font-medium">{supplier.fullname}</td>
                                                    <td className="p-3 text-sm text-gray-500">{supplier.mobile || '-'}</td>
                                                    <td className="p-3 text-red-600 dark:text-red-400" dir="ltr">
                                                        {formatCurrency(supplier.totalPayouts)} تومان
                                                    </td>
                                                    <td className={`p-3 font-bold ${supplier.balance < 0 ? 'text-red-600' : 'text-green-600'}`} dir="ltr">
                                                        {formatCurrency(supplier.balance)} تومان
                                                    </td>
                                                    <td className="p-3">
                                                        <button 
                                                            onClick={() => handleOpenStatementModal(supplier.id, supplier.fullname)} 
                                                            className="text-indigo-500 hover:text-indigo-700 font-semibold text-sm bg-indigo-50 dark:bg-indigo-900/30 px-3 py-1 rounded transition-colors"
                                                        >
                                                            مشاهده صورتحساب
                                                        </button>
                                                    </td>
                                                </tr>
                                            )) : (
                                                <tr>
                                                    <td colSpan="5" className="p-8 text-center text-gray-500">هیچ تامین‌کننده‌ای یافت نشد.</td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    )}

                    {allocationModalState.isOpen && (
                        <PaymentAllocationModal 
                            isOpen={allocationModalState.isOpen} 
                            onClose={() => setAllocationModalState({ isOpen: false, preInvoiceData: null })} 
                            onSave={handleSaveAllocationAndCreateInvoice}
                            preInvoiceData={allocationModalState.preInvoiceData}
                        />
                    )}
                    {editingInvoice && <EditInvoiceModal isOpen={!!editingInvoice} onClose={handleCloseEditModal} onSave={handleSaveInvoice} invoice={editingInvoice} addToast={addToast} />}
                    {printingInvoice && <PrintableInvoice invoice={printingInvoice} onClose={handleClosePrintModal} customerBalance={customerBalances[printingInvoice?.customeruserid]} />}
                    {printingPreInvoice && <PrintablePreInvoice preInvoiceData={printingPreInvoice} onClose={handleClosePrintPreInvoiceModal} customerBalance={customerBalances[printingPreInvoice?.customerId]} />}

                    {/* Statement of Account Modal Render */}
                    {statementModalState.isOpen && (
                        <StatementOfAccountModal
                            isOpen={statementModalState.isOpen}
                            onClose={handleCloseStatementModal}
                            customerId={statementModalState.customerId}
                            customerName={statementModalState.customerName}
                            formatCurrency={formatCurrency}
                            supabaseClient={supabaseClient}
                        />
                    )}
                    
                    {/* NEW: Confirm Delete Modal Render */}
                    {deleteModalState.isOpen && (
                        <ConfirmDeleteModal
                            isOpen={deleteModalState.isOpen}
                            onClose={handleCloseDeleteModal}
                            onConfirm={handleDeleteInvoice}
                            invoice={deleteModalState.invoiceToDelete}
                        />
                    )}
                </div>
            );
        };
        
        // App component to provide Toast context
        const App = () => (
            <ToastProvider>
                <InvoiceManagement />
            </ToastProvider>
        );

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

    </script>
</body>
</html>
