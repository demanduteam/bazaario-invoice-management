        const SupplierBalancesTab = () => {
            const [balances, setBalances] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [viewingSupplier, setViewingSupplier] = React.useState(null);
            const [payingSupplier, setPayingSupplier] = React.useState(null);
            const { addToast } = useToasts();

            const fetchBalanceData = React.useCallback(async () => {
                setLoading(true);
                try {
                    const { data: suppliers, error: supplierError } = await supabaseClient.from('profiles').select('id, fullname, mobile').eq('roleid', 3);
                    if (supplierError) throw supplierError;
                    if (!suppliers || suppliers.length === 0) { setBalances([]); setLoading(false); return; }

                    const { data: pos, error: poError } = await supabaseClient.from('purchase_orders').select(`id, supplier_id, status, created_at, demandid, purchase_order_details (quantity, purchase_price)`);
                    if (poError) throw poError;

                    // Fetch demand -> customer mappings securely
                    const demandIds = [...new Set(pos.map(po => po.demandid).filter(Boolean))];
                    const customersMap = new Map();
                    if (demandIds.length > 0) {
                         const { data: demands } = await supabaseClient.from('demand').select('id, customeruserid').in('id', demandIds);
                         if (demands && demands.length > 0) {
                             const customerIds = [...new Set(demands.map(d => d.customeruserid).filter(Boolean))];
                             if (customerIds.length > 0) {
                                 const { data: customers } = await supabaseClient.from('profiles').select('id, fullname').in('id', customerIds);
                                 const profileMap = new Map((customers || []).map(c => [c.id, c.fullname]));
                                 demands.forEach(d => {
                                     if (d.customeruserid) customersMap.set(d.id, profileMap.get(d.customeruserid) || 'نامشخص');
                                 });
                             }
                         }
                    }

                    const supplierIds = suppliers.map(s => s.id);
                    const { data: txs, error: txError } = await supabaseClient.from('usertransaction').select('id, userid, amount, createdat, description').in('userid', supplierIds);
                    if (txError) throw txError;

                    const map = {};
                    suppliers.forEach(s => { map[s.id] = { ...s, totalPO: 0, totalPaid: 0, pos: [], transactions: [] }; });

                    pos.forEach(po => {
                        if (map[po.supplier_id] && po.status !== 'Cancelled' && po.status !== 'Merged') {
                            const poTotal = po.purchase_order_details.reduce((sum, d) => sum + ((d.quantity || 0) * (d.purchase_price || 0)), 0);
                            map[po.supplier_id].totalPO += poTotal;
                            po.customerName = customersMap.get(po.demandid) || 'نامشخص';
                            map[po.supplier_id].pos.push(po);
                        }
                    });

                    txs.forEach(tx => {
                        if (map[tx.userid]) {
                            map[tx.userid].totalPaid += Math.abs(tx.amount || 0);
                            map[tx.userid].transactions.push(tx);
                        }
                    });

                    const result = Object.values(map).map(s => ({ ...s, balance: s.totalPaid - s.totalPO })).sort((a, b) => a.fullname.localeCompare(b.fullname));
                    setBalances(result);
                } catch (error) { addToast('خطا در محاسبه تراز حساب تامین کنندگان', 'error'); } finally { setLoading(false); }
            }, []);

            React.useEffect(() => { fetchBalanceData(); }, [fetchBalanceData]);

            const handlePaymentSave = async (paymentData) => {
                try {
                    const insertWithManualId = async (baseRecord) => {
                        for (let i = 0; i < 5; i++) {
                            try {
                                const { data: maxData } = await supabaseClient.from('usertransaction').select('id').order('id', { ascending: false }).limit(1).single();
                                let nextId = maxData ? maxData.id + 1 : 1;
                                const { error } = await supabaseClient.from('usertransaction').insert({ ...baseRecord, id: nextId });
                                if (!error) return;
                                if (error.code === '23505') { await new Promise(res => setTimeout(res, 300)); continue; }
                                throw error;
                            } catch (err) { if (i === 4) throw err; }
                        }
                    };
                    await insertWithManualId(paymentData);
                    setPayingSupplier(null);
                    fetchBalanceData(); 
                } catch (error) { addToast(`خطا در ثبت تراکنش: ${error.message}`, 'error'); }
            };

            const handleDownloadSupplierExcel = (supplier) => {
                if (!supplier) return;
                try {
                    const merged = [];
                    (supplier.pos || []).forEach(po => {
                        const poTotal = po.purchase_order_details.reduce((sum, detail) => sum + ((detail.quantity || 0) * (detail.purchase_price || 0)), 0);
                        merged.push({
                            date: po.created_at,
                            type: 'سفارش خرید (بدهی ما)',
                            customerName: po.customerName || 'نامشخص',
                            description: `شماره سفارش #${po.id}`,
                            amount: poTotal
                        });
                    });
                    (supplier.transactions || []).forEach(tx => {
                        merged.push({
                            date: tx.createdat,
                            type: 'پرداختی (بستانکاری ما)',
                            customerName: '-',
                            description: tx.description || `تراکنش #${tx.id}`,
                            amount: -Math.abs(tx.amount)
                        });
                    });
                    merged.sort((a, b) => new Date(a.date) - new Date(b.date));
                    let runningBalance = 0;
                    const exportData = merged.map(item => {
                        runningBalance += item.amount;
                        return {
                            'تاریخ': new Date(item.date).toLocaleDateString('fa-IR'),
                            'نوع': item.type,
                            'مشتری': item.customerName,
                            'شرح': item.description,
                            'مبلغ (تومان)': item.amount,
                            'تراز (تومان)': runningBalance
                        };
                    });
                    if (exportData.length === 0) {
                        addToast('هیچ داده‌ای برای این تامین‌کننده وجود ندارد.', 'warning');
                        return;
                    }
                    const ws = XLSX.utils.json_to_sheet(exportData);
                    const wscols = [{wch: 15}, {wch: 25}, {wch: 20}, {wch: 40}, {wch: 15}, {wch: 15}];
                    ws['!cols'] = wscols;
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "صورتحساب");
                    const safeName = supplier.fullname ? supplier.fullname.replace(/\s+/g, '_') : 'Supplier';
                    const fileName = `Supplier_Statement_${safeName}_${new Date().toLocaleDateString('fa-IR').replace(/\//g, '-')}.xlsx`;
                    XLSX.writeFile(wb, fileName);
                    addToast('فایل اکسل با موفقیت دانلود شد', 'success');
                } catch (err) {
                    console.error('Export failed:', err);
                    addToast('خطا در ایجاد فایل اکسل', 'error');
                }
            };

            if (loading) return <div className="spinner"></div>;

            return (
                <div className="bg-white dark:bg-gray-800 rounded-xl shadow-sm border dark:border-gray-700 overflow-hidden">
                    <div className="overflow-x-auto">
                        <table className="w-full text-right">
                            <thead className="bg-gray-50 dark:bg-gray-900 text-gray-500 dark:text-gray-400 text-sm">
                                <tr>
                                    <th className="p-4 font-semibold">نام تامین کننده</th><th className="p-4 font-semibold text-center">شماره تماس</th><th className="p-4 font-semibold text-center">مجموع خرید (بدهی ما)</th><th className="p-4 font-semibold text-center">مجموع پرداختی</th><th className="p-4 font-semibold text-center">تراز حساب</th><th className="p-4 font-semibold text-center">وضعیت</th><th className="p-4 font-semibold text-center">عملیات</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 dark:divide-gray-700 text-sm">
                                {balances.length === 0 ? <tr><td colSpan="7" className="p-8 text-center text-gray-500">هیچ تامین کننده‌ای یافت نشد.</td></tr> : balances.map(supplier => (
                                    <tr key={supplier.id} className="hover:bg-gray-50 dark:hover:bg-gray-700/50">
                                        <td className="p-4 font-medium">{supplier.fullname}</td>
                                        <td className="p-4 text-center text-gray-500 font-mono">{supplier.mobile || '-'}</td>
                                        <td className="p-4 text-center text-red-600 dark:text-red-400 font-medium" dir="ltr">{formatCurrency(supplier.totalPO)}</td>
                                        <td className="p-4 text-center text-green-600 dark:text-green-400 font-medium" dir="ltr">{formatCurrency(supplier.totalPaid)}</td>
                                        <td className={`p-4 text-center font-bold text-lg ${supplier.balance < 0 ? 'text-red-600' : (supplier.balance > 0 ? 'text-green-600' : 'text-gray-600')}`} dir="ltr">{formatCurrency(Math.abs(supplier.balance))}</td>
                                        <td className="p-4 text-center">
                                            {supplier.balance === 0 ? <span className="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs">تسویه</span> : supplier.balance < 0 ? <span className="bg-red-100 text-red-700 px-2 py-1 rounded text-xs">بدهکار</span> : <span className="bg-green-100 text-green-700 px-2 py-1 rounded text-xs">بستانکار</span>}
                                        </td>
                                        <td className="p-4 text-center">
                                            <div className="flex justify-center gap-2">
                                                <button onClick={() => setViewingSupplier(supplier)} className="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded text-xs font-medium border border-indigo-200">جزئیات</button>
                                                <button onClick={() => setPayingSupplier(supplier)} className="bg-green-50 text-green-600 hover:bg-green-100 px-3 py-1.5 rounded text-xs font-medium border border-green-200">ثبت پرداخت</button>
                                                <button onClick={() => handleDownloadSupplierExcel(supplier)} className="bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded text-xs font-medium border border-blue-200">دانلود اکسل</button>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    {viewingSupplier && <SupplierDetailsModal supplier={viewingSupplier} onClose={() => setViewingSupplier(null)} />}
                    {payingSupplier && <AddPaymentModal supplier={payingSupplier} onClose={() => setPayingSupplier(null)} onSave={handlePaymentSave} />}
                </div>
            );
        };

        // ==================================================
        // Invoice Management Main Component
        // ==================================================
        const InvoiceManagement = ({ isDarkMode, toggleTheme }) => {
            const [preInvoices, setPreInvoices] = React.useState({});
            const [invoices, setInvoices] = React.useState([]);
            const [allFilteredInvoices, setAllFilteredInvoices] = React.useState([]); 
            const [transactions, setTransactions] = React.useState([]); 
            const [isLoading, setIsLoading] = React.useState(true);
            const [error, setError] = React.useState('');
            const [isSubmitting, setIsSubmitting] = React.useState(null);
            const [allocationModalState, setAllocationModalState] = React.useState({ isOpen: false, preInvoiceData: null });
            const [activeTab, setActiveTab] = React.useState('pending');
            const [editingInvoice, setEditingInvoice] = React.useState(null);
            const [printingInvoice, setPrintingInvoice] = React.useState(null);
            const [printingPreInvoice, setPrintingPreInvoice] = React.useState(null);
            const [customerBalances, setCustomerBalances] = React.useState({}); 
            const [statementModalState, setStatementModalState] = React.useState({ isOpen: false, customerId: null, customerName: '' }); 
            const [deleteModalState, setDeleteModalState] = React.useState({ isOpen: false, invoiceToDelete: null }); 
            const { addToast } = useToasts();
            
            const [currentPage, setCurrentPage] = React.useState(0);
            const [invoicesPerPage] = React.useState(10);
            const [totalInvoices, setTotalInvoices] = React.useState(0);
            const [totalTransactions, setTotalTransactions] = React.useState(0);
            const [searchQuery, setSearchQuery] = React.useState('');
            const [showShippingOnly, setShowShippingOnly] = React.useState(false);
            const [showNonZeroBalanceOnly, setShowNonZeroBalanceOnly] = React.useState(false);

            // Transaction Edit State
            const [editingTxId, setEditingTxId] = React.useState(null);
            const [editingTxDesc, setEditingTxDesc] = React.useState('');

            const fetchGlobalBalances = async () => {
                try {
                    const { data: allTx, error: txError } = await supabaseClient.from('usertransaction').select('userid, amount');
                    if (txError) throw txError;
                    const { data: allInv, error: invError } = await supabaseClient.from('demandinvoice').select('customeruserid, totalamount');
                    if (invError) throw invError;
                    const balanceMap = {};
                    allTx.forEach(tx => {
                        if (!tx.userid) return;
                        balanceMap[tx.userid] = (balanceMap[tx.userid] || 0) + (tx.amount || 0);
                    });
                    allInv.forEach(inv => {
                        if (!inv.customeruserid) return;
                        balanceMap[inv.customeruserid] = (balanceMap[inv.customeruserid] || 0) - (inv.totalamount || 0);
                    });
                    setCustomerBalances(balanceMap);
                    return balanceMap;
                } catch (err) {
                    console.error("Error fetching global balances:", err);
                    return {};
                }
            };

            const fetchBalancesForUsers = async (userIds) => {
                const uniqueIds = [...new Set(userIds)].filter(id => customerBalances[id] === undefined);
                if (uniqueIds.length === 0) return;
                const newBalances = {};
                await Promise.all(uniqueIds.map(async (uid) => {
                    const balance = await fetchUserBalance(uid);
                    newBalances[uid] = balance;
                }));
                setCustomerBalances(prev => ({ ...prev, ...newBalances }));
            };

            const fetchTransactionData = async () => {
                setIsLoading(true); setError('');
                try {
                    const from = currentPage * invoicesPerPage;
                    const to = from + invoicesPerPage - 1;
                    let queryBuilder = supabaseClient.from('usertransaction').select(`*, profile:userid(fullname), invoice:demandinvoiceid(id)`, { count: 'exact' });

                    if (searchQuery) {
                        if (!isNaN(searchQuery)) queryBuilder = queryBuilder.eq('demandinvoiceid', searchQuery);
                        else queryBuilder = supabaseClient.from('usertransaction').select(`*, profile:userid!inner(fullname), invoice:demandinvoiceid(id)`, { count: 'exact' }).ilike('profile.fullname', `%${searchQuery}%`);
                    }

                    const { data, error, count } = await queryBuilder.order('createdat', { ascending: false }).range(from, to);
                    if (error) throw error;
                    setTransactions(data || []);
                    setTotalTransactions(count || 0);
                } catch (err) {
                    setError(`خطا در بارگذاری تراکنش‌ها: ${err.message}`);
                } finally { setIsLoading(false); }
            };

            const fetchPendingData = async () => {
                setIsLoading(true); setError('');
                try {
                    const { data: pendingData, error: rpcError } = await supabaseClient.rpc('get_items_for_invoicing');
                    if (rpcError) throw rpcError;
                    
                    const groupedByCustomer = (pendingData || []).reduce((acc, rpcRow) => {
                        const customerId = rpcRow.customer_id;
                        if (!customerId) return acc;
                        if (!acc[customerId]) {
                            acc[customerId] = { customerId, customerName: rpcRow.customer_name || 'مشتری نامشخص', demandid: rpcRow.demandid, items: {}, suppliers: {}, totalAmount: 0, shipping: 0, discount: 0 };
                        }
                        const itemId = rpcRow.item_id;
                        if (!acc[customerId].items[itemId]) {
                            const sale_price = rpcRow.sale_price || (rpcRow.approved_supply_price ? Math.round(rpcRow.approved_supply_price * 1.10) : 0);
                            const subtotal = (rpcRow.approved_supply_quantity || 0) * sale_price;
                            acc[customerId].items[itemId] = { 
                                id: itemId, 
                                product: { title: rpcRow.product_name }, 
                                approved_supply_quantity: rpcRow.approved_supply_quantity, 
                                sale_price, 
                                shipping_price: 0, 
                                subtotal, 
                                supplier_id: rpcRow.supplier_id,
                                approved_supply_price: rpcRow.approved_supply_price || 0 
                            };
                            acc[customerId].totalAmount += subtotal;
                        }
                        const supplierId = rpcRow.supplier_id;
                        if (supplierId && !acc[customerId].suppliers[supplierId]) acc[customerId].suppliers[supplierId] = { id: supplierId, name: rpcRow.supplier_name };
                        return acc;
                    }, {});

                    Object.keys(groupedByCustomer).forEach(customerId => { groupedByCustomer[customerId].items = Object.values(groupedByCustomer[customerId].items); });
                    setPreInvoices(groupedByCustomer);
                    const customerIds = Object.keys(groupedByCustomer);
                    if (customerIds.length > 0) fetchBalancesForUsers(customerIds);
                } catch (err) {
                    setError(`خطا در بارگذاری اطلاعات آماده صدور: ${err.message}.`);
                    addToast(`خطا در بارگذاری اطلاعات آماده صدور: ${err.message}`, 'error');
                } finally { setIsLoading(false); }
            };
            
            const fetchHistoricalData = async () => {
                setIsLoading(true); setError('');
                try {
                    if (showNonZeroBalanceOnly) {
                        const balanceMap = await fetchGlobalBalances();
                        let queryBuilder = supabaseClient.from('demandinvoice').select(`*, demandinvoicedetail(*, profiles:supplieruserid(fullname), demand_item:demand_item_id(product(title)), location:locationid(postalcode)), customer:customeruserid(id, fullname, national_id, mobile, location:locationid(postalcode, address, plaque))`).order('createdat', { ascending: false }).limit(1000); 
                        if (showShippingOnly) queryBuilder = queryBuilder.gt('totalshippingprice', 0);

                        const { data: allData, error: loadError } = await queryBuilder;
                        if (loadError) throw loadError;

                        const seenCustomers = new Set();
                        const uniqueFiltered = [];
                        (allData || []).forEach(inv => {
                            const customerId = inv.customeruserid;
                            const bal = balanceMap[customerId];
                            if (bal !== 0 && bal !== undefined && !seenCustomers.has(customerId)) {
                                seenCustomers.add(customerId);
                                uniqueFiltered.push(inv);
                            }
                        });
                        setAllFilteredInvoices(uniqueFiltered);
                        setTotalInvoices(uniqueFiltered.length);
                        const from = currentPage * invoicesPerPage;
                        setInvoices(uniqueFiltered.slice(from, from + invoicesPerPage));
                    } else {
                        const from = currentPage * invoicesPerPage;
                        const to = from + invoicesPerPage - 1;
                        let queryBuilder = supabaseClient.from('demandinvoice');
                        let selectString = `*, demandinvoicedetail(*, profiles:supplieruserid(fullname), demand_item:demand_item_id(product(title)), location:locationid(postalcode))`;

                        if (searchQuery && !(!isNaN(searchQuery) && !isNaN(parseFloat(searchQuery)))) {
                            selectString += `, customer:customeruserid!inner(id, fullname, national_id, mobile, location:locationid(postalcode, address, plaque))`;
                            queryBuilder = queryBuilder.select(selectString, { count: 'exact' }).ilike('customer.fullname', `%${searchQuery}%`);
                        } else {
                            selectString += `, customer:customeruserid(id, fullname, national_id, mobile, location:locationid(postalcode, address, plaque))`;
                            queryBuilder = queryBuilder.select(selectString, { count: 'exact' });
                            if (searchQuery) queryBuilder = queryBuilder.eq('id', searchQuery);
                        }

                        if (showShippingOnly) queryBuilder = queryBuilder.gt('totalshippingprice', 0);

                        const { data: historicalData, error: historicalError, count } = await queryBuilder.order('createdat', { ascending: false }).range(from, to);
                        if (historicalError) throw historicalError;
                        setInvoices(historicalData || []);
                        setTotalInvoices(count || 0);
                        if (historicalData && historicalData.length > 0) fetchBalancesForUsers(historicalData.map(inv => inv.customeruserid).filter(Boolean));
                    }
                } catch (err) {
                    setError(`خطا در بارگذاری تاریخچه: ${err.message}.`);
                    addToast(`خطا در بارگذاری تاریخچه: ${err.message}`, 'error');
                } finally { setIsLoading(false); }
            }
            
            React.useEffect(() => {
                if (activeTab === 'pending') fetchPendingData();
                else if (activeTab === 'transactions') fetchTransactionData();
            }, [activeTab]); 
            
            React.useEffect(() => {
                if(activeTab === 'history') fetchHistoricalData();
                else if (activeTab === 'transactions') fetchTransactionData();
            }, [activeTab, currentPage, searchQuery, showShippingOnly, showNonZeroBalanceOnly]); 
            
            const refreshData = async () => {
                setCustomerBalances({}); setAllFilteredInvoices([]);
                if (activeTab === 'pending') await fetchPendingData();
                else if (activeTab === 'transactions') { if (currentPage !== 0) setCurrentPage(0); else await fetchTransactionData(); }
                else if (activeTab === 'history') { if(currentPage !== 0) setCurrentPage(0); else await fetchHistoricalData(); }
            };

            const handleSearchChange = (e) => { setSearchQuery(e.target.value); setCurrentPage(0); };
            const handleFilterChange = (e) => { setShowShippingOnly(e.target.checked); setCurrentPage(0); };
            const handleBalanceFilterChange = (e) => { setShowNonZeroBalanceOnly(e.target.checked); setCurrentPage(0); };
            
            const recalculatePreInvoiceTotal = (invoice) => {
                const subtotal = invoice.items.reduce((sum, item) => sum + item.subtotal, 0);
                const discount = invoice.discount || 0;
                const shipping = invoice.items.reduce((sum, item) => sum + (item.shipping_price || 0), 0);
                return subtotal - discount + shipping;
            }

            const handlePreInvoiceMetaChange = (customerId, field, value) => {
                setPreInvoices(prev => {
                    const newInvoices = { ...prev };
                    const invoice = { ...newInvoices[customerId] };
                    invoice[field] = parseFormattedNumber(value);
                    invoice.totalAmount = recalculatePreInvoiceTotal(invoice);
                    newInvoices[customerId] = invoice;
                    return newInvoices;
                });
            }

            const handlePriceChange = (customerId, itemId, newPrice) => {
                setPreInvoices(prev => {
                    const newInvoices = { ...prev };
                    const invoice = { ...newInvoices[customerId] };
                    invoice.items = invoice.items.map(item => {
                        if (item.id === itemId) return { ...item, sale_price: parseFormattedNumber(newPrice), subtotal: (item.approved_supply_quantity || 0) * parseFormattedNumber(newPrice) };
                        return item;
                    });
                    invoice.totalAmount = recalculatePreInvoiceTotal(invoice);
                    newInvoices[customerId] = invoice;
                    return newInvoices;
                });
            };

            const handleItemShippingChange = (customerId, itemId, newShipping) => {
                setPreInvoices(prev => {
                    const newInvoices = { ...prev };
                    const invoice = { ...newInvoices[customerId] };
                    invoice.items = invoice.items.map(item => {
                        if (item.id === itemId) return { ...item, shipping_price: parseFormattedNumber(newShipping) };
                        return item;
                    });
                    invoice.totalAmount = recalculatePreInvoiceTotal(invoice);
                    invoice.shipping = invoice.items.reduce((sum, item) => sum + (item.shipping_price || 0), 0);
                    newInvoices[customerId] = invoice;
                    return newInvoices;
                });
            };
            
            const handleQuantityChange = (customerId, itemId, newQuantity) => {
                setPreInvoices(prev => {
                    const newInvoices = { ...prev };
                    const invoice = { ...newInvoices[customerId] };
                    invoice.items = invoice.items.map(item => {
                        if (item.id === itemId) return { ...item, approved_supply_quantity: parseFormattedNumber(newQuantity) || 0, subtotal: (parseFormattedNumber(newQuantity) || 0) * (item.sale_price || 0) };
                        return item;
                    });
                    invoice.totalAmount = recalculatePreInvoiceTotal(invoice);
                    newInvoices[customerId] = invoice;
                    return newInvoices;
                });
            };

            const handleInitiatePayment = (customerId) => { setAllocationModalState({ isOpen: true, preInvoiceData: preInvoices[customerId] }); };

            const handleSaveAllocationAndCreateInvoice = async ({ validCustomerPayments, allocations, preInvoiceData, purchaseDetails }) => {
                const { customerId, items, discount, demandid } = preInvoiceData;
                const totalShipping = items.reduce((sum, item) => sum + (item.shipping_price || 0), 0);
                setIsSubmitting(customerId);
                try {
                    // 1. Create Invoice
                    const totalQuantity = items.reduce((sum, item) => sum + (item.approved_supply_quantity || 0), 0);
                    const { data: invoiceHeader, error: headerError } = await supabaseClient.from('demandinvoice').insert({ 
                            demandid: demandid, customeruserid: customerId, totalquantity: totalQuantity, paymentstatusid: 1, totalamount: preInvoiceData.totalAmount, discount: discount || 0, totalshippingprice: totalShipping
                        }).select().single();
                    if (headerError) throw headerError;
                    
                    const uniqueItems = Array.from(new Map(items.map(item => [item.id, item])).values());
                    
                    // 2. Create Invoice Details using chosen suppliers from Purchase Details
                    const invoiceDetails = uniqueItems.map(item => {
                        const matchedPD = purchaseDetails.find(pd => pd.demand_item_id === item.id);
                        const supplierUserId = matchedPD ? matchedPD.supplier_id : item.supplier_id;
                        
                        if (!supplierUserId) throw new Error(`شناسه تامین‌کننده برای محصول "${item.product.title}" یافت نشد.`);
                        
                        return { demandinvoiceid: invoiceHeader.id, demand_item_id: item.id, quantity: item.approved_supply_quantity, sales_price: item.sale_price, shippingprice: item.shipping_price || 0, supplieruserid: supplierUserId };
                    });

                    const { error: detailError } = await supabaseClient.from('demandinvoicedetail').insert(invoiceDetails);
                    if (detailError) throw detailError;

                    // 3. Create or Update POs Grouped by Supplier
                    const poGroups = purchaseDetails.reduce((acc, pd) => {
                        if (!pd.supplier_id) throw new Error(`تامین‌کننده برای محصول ${pd.title} انتخاب نشده است.`);
                        if (!acc[pd.supplier_id]) acc[pd.supplier_id] = [];
                        acc[pd.supplier_id].push(pd);
                        return acc;
                    }, {});

                    // Fetch ALL existing POs for this demand to prevent duplication
                    const { data: existingPOs, error: fetchPoError } = await supabaseClient
                        .from('purchase_orders')
                        .select('id, supplier_id, purchase_order_details(id, demand_item_id)')
                        .eq('demandid', demandid);
                    
                    if (fetchPoError) throw fetchPoError;

                    // Collect all existing details to easily find them and update them
                    const existingDetailsMap = new Map(); 
                    existingPOs?.forEach(po => {
                        po.purchase_order_details?.forEach(d => {
                            existingDetailsMap.set(d.demand_item_id, { id: d.id, purchase_order_id: po.id });
                        });
                    });

                    const touchedPoIds = new Set();
                    let availablePoIds = (existingPOs || []).map(po => po.id);

                    for (const [supplierId, pds] of Object.entries(poGroups)) {
                        const totalActualShipping = pds.reduce((sum, item) => sum + ((item.quantity || 0) * (item.actual_shipping_price || 0)), 0);
                        
                        let currentPoId;
                        const exactPo = existingPOs?.find(po => po.supplier_id === supplierId && !touchedPoIds.has(po.id));
                        
                        if (exactPo) {
                            currentPoId = exactPo.id;
                            const { error: updatePoError } = await supabaseClient.from('purchase_orders').update({
                                status: 'خریداری شد',
                                demandinvoice_id: invoiceHeader.id,
                                actual_shipping_cost: totalActualShipping
                            }).eq('id', currentPoId);
                            if (updatePoError) throw updatePoError;
                            
                            touchedPoIds.add(currentPoId);
                            availablePoIds = availablePoIds.filter(id => id !== currentPoId);
                        } else if (availablePoIds.length > 0) {
                            currentPoId = availablePoIds.shift();
                            const { error: updatePoError } = await supabaseClient.from('purchase_orders').update({
                                supplier_id: supplierId,
                                status: 'خریداری شد',
                                demandinvoice_id: invoiceHeader.id,
                                actual_shipping_cost: totalActualShipping
                            }).eq('id', currentPoId);
                            if (updatePoError) throw updatePoError;
                            
                            touchedPoIds.add(currentPoId);
                        } else {
                            const { data: newPO, error: poError } = await supabaseClient.from('purchase_orders').insert({
                                demandid: demandid,
                                demandinvoice_id: invoiceHeader.id,
                                supplier_id: supplierId,
                                status: 'خریداری شد',
                                actual_shipping_cost: totalActualShipping
                            }).select().single();
                            if (poError) throw poError;
                            
                            currentPoId = newPO.id;
                            touchedPoIds.add(currentPoId);
                        }

                        for (const pd of pds) {
                            const existingDetail = existingDetailsMap.get(pd.demand_item_id);
                            
                            const detailPayload = {
                                purchase_order_id: currentPoId,
                                quantity: pd.quantity,
                                purchase_price: pd.purchase_price,
                                actual_shipping_price: pd.actual_shipping_price,
                                supplier_invoice_id: pd.supplier_invoice_id || null,
                                note: pd.note || null
                            };
                            
                            if (existingDetail) {
                                const { error: updateDetailError } = await supabaseClient.from('purchase_order_details')
                                    .update(detailPayload)
                                    .eq('id', existingDetail.id);
                                if (updateDetailError) throw updateDetailError;
                                
                                existingDetailsMap.delete(pd.demand_item_id);
                            } else {
                                const { error: insertDetailError } = await supabaseClient.from('purchase_order_details')
                                    .insert({
                                        ...detailPayload,
                                        demand_item_id: pd.demand_item_id
                                    });
                                if (insertDetailError) throw insertDetailError;
                            }
                        }
                    }

                    if (existingDetailsMap.size > 0) {
                        const detailIdsToDelete = Array.from(existingDetailsMap.values()).map(d => d.id);
                        await supabaseClient.from('purchase_order_details').delete().in('id', detailIdsToDelete);
                    }

                    if (availablePoIds.length > 0) {
                        await supabaseClient.from('purchase_order_logs').delete().in('purchase_order_id', availablePoIds);
                        await supabaseClient.from('purchase_orders').delete().in('id', availablePoIds);
                    }

                    // 4. Create Transactions
                    const transactions = [];
                    
                    validCustomerPayments.forEach(cp => {
                        transactions.push({
                            userid: customerId,
                            amount: cp.amount,
                            demandinvoiceid: invoiceHeader.id,
                            transactiontypeid: 1,
                            customer_payment_date: cp.gregorianDate,
                            description: cp.description || ''
                        });
                    });
                    
                    allocations.forEach(alloc => {
                        transactions.push({ 
                            userid: alloc.userId, 
                            amount: -Math.abs(alloc.amount), 
                            demandinvoiceid: invoiceHeader.id, 
                            transactiontypeid: 2,
                            description: alloc.description || '' 
                        });
                    });
                    
                    const insertWithManualId = async (baseRecord) => {
                        const MAX_RETRIES = 5;
                        for (let i = 0; i < MAX_RETRIES; i++) {
                            try {
                                const { data: maxData } = await supabaseClient.from('usertransaction').select('id').order('id', { ascending: false }).limit(1).single();
                                let nextId = maxData ? maxData.id + 1 : 1;
                                const recordWithId = { ...baseRecord, id: nextId };
                                const { error } = await supabaseClient.from('usertransaction').insert(recordWithId);
                                if (!error) return;
                                if (error.code === '23505' || error.message.includes('duplicate key')) { await new Promise(res => setTimeout(res, Math.random() * 500)); continue; }
                                throw error;
                            } catch (err) { if (i === MAX_RETRIES - 1) throw err; }
                        }
                        throw new Error("خطا در تولید شناسه یکتا برای تراکنش پس از چندین تلاش.");
                    };

                    for (const tx of transactions) await insertWithManualId(tx);

                    // 5. Update Status
                    const PAID_AWAITING_SHIPMENT_STATUS_ID = 19;
                    const itemUpdates = uniqueItems.map(item => supabaseClient.from('demand_item').update({ approved_supply_quantity: item.approved_supply_quantity, demandstatusid: PAID_AWAITING_SHIPMENT_STATUS_ID }).eq('id', item.id));
                    const updateResults = await Promise.all(itemUpdates);
                    const firstUpdateError = updateResults.find(res => res.error);
                    if (firstUpdateError) throw firstUpdateError.error;
                    
                    addToast('فاکتور، تخصیص مالی و سفارش خرید با موفقیت ایجاد شدند!', 'success');
                    setAllocationModalState({ isOpen: false, preInvoiceData: null });
                    await fetchPendingData(); 
                    if (activeTab === 'history') await fetchHistoricalData(); 
                } catch (err) {
                    addToast(`خطا در عملیات ثبت: ${err.message}`, 'error');
                } finally { setIsSubmitting(null); }
            };
            
            const handleOpenEditModal = (invoice) => {
                const enrichedDetails = invoice.demandinvoicedetail.map(detail => ({ ...detail, product: { title: detail.demand_item?.product?.title || 'محصول حذف شده' } }));
                setEditingInvoice({ ...invoice, demandinvoicedetail: enrichedDetails });
            };
            const handleCloseEditModal = () => setEditingInvoice(null);
            const handleOpenPrintModal = async (invoice) => {
                if (invoice.customeruserid) {
                    const balance = await fetchUserBalance(invoice.customeruserid);
                    setCustomerBalances(prev => ({...prev, [invoice.customeruserid]: balance}));
                }
                setPrintingInvoice(invoice);
            };
            const handleClosePrintModal = () => setPrintingInvoice(null);
            const handleOpenPrintPreInvoiceModal = async (data) => {
                if (data.customerId) {
                    const balance = await fetchUserBalance(data.customerId);

                                        </table>
                                    </div>
                                    {totalTransactions > invoicesPerPage && (
                                        <div className="flex justify-between items-center mt-4 p-2 bg-gray-50 dark:bg-gray-700/30 rounded-lg">
                                            <button onClick={prevPage} disabled={currentPage === 0} className="px-4 py-1.5 bg-white dark:bg-gray-600 border rounded shadow-sm disabled:opacity-50 text-sm">قبلی</button>
                                            <span className="text-sm">صفحه {currentPage + 1} از {Math.ceil(totalTransactions / invoicesPerPage) || 1}</span>
                                            <button onClick={nextPage} disabled={(currentPage + 1) * invoicesPerPage >= totalTransactions} className="px-4 py-1.5 bg-white dark:bg-gray-600 border rounded shadow-sm disabled:opacity-50 text-sm">بعدی</button>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    )}

                    {activeTab === 'suppliers' && (
                        <div className="animate-fade-in space-y-4">
                            <SupplierBalancesTab />
                        </div>
                    )}

                    {/* Modals Mounting */}
                    {allocationModalState.isOpen && <PaymentAllocationModal isOpen={allocationModalState.isOpen} onClose={() => setAllocationModalState({ isOpen: false, preInvoiceData: null })} onSave={handleSaveAllocationAndCreateInvoice} preInvoiceData={allocationModalState.preInvoiceData} />}
                    {editingInvoice && <EditInvoiceModal isOpen={!!editingInvoice} onClose={handleCloseEditModal} onSave={handleSaveInvoice} invoice={editingInvoice} addToast={addToast} />}
                    {printingInvoice && <PrintableInvoice invoice={printingInvoice} onClose={handleClosePrintModal} customerBalance={customerBalances[printingInvoice?.customeruserid]} />}
                    {printingPreInvoice && <PrintablePreInvoice preInvoiceData={printingPreInvoice} onClose={handleClosePrintPreInvoiceModal} customerBalance={customerBalances[printingPreInvoice?.customerId]} />}
                    {statementModalState.isOpen && <StatementOfAccountModal isOpen={statementModalState.isOpen} onClose={handleCloseStatementModal} customerId={statementModalState.customerId} customerName={statementModalState.customerName} formatCurrency={formatCurrency} supabaseClient={supabaseClient} />}
                    {deleteModalState.isOpen && <ConfirmDeleteModal isOpen={deleteModalState.isOpen} onClose={handleCloseDeleteModal} onConfirm={handleDeleteInvoice} invoice={deleteModalState.invoiceToDelete} />}
                </div>
            );
        };
        
        // App component to provide Toast context
        const App = () => {
            const [isDarkMode, setIsDarkMode] = React.useState(() => {
                const saved = localStorage.getItem('theme');
                if (saved) return saved === 'dark';
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            });

            React.useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [isDarkMode]);

            const toggleTheme = () => setIsDarkMode(!isDarkMode);

            return (
                <ToastProvider>
                    <InvoiceManagement isDarkMode={isDarkMode} toggleTheme={toggleTheme} />
                </ToastProvider>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

    </script>
</body>
</html>
