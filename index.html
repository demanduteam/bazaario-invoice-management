    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        .dark body {
            background-color: #111827; /* dark:bg-gray-900 */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .dark ::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        ::-webkit-scrollbar-thumb {
            background: #888; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease-in-out;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            padding: 1.5rem;
            border-radius: 0.75rem;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s ease-in-out;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .modal-overlay.open .modal-content {
            transform: scale(1);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Toast Notification Styles */
        .toast-container {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .toast {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 1.25rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            animation: toast-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: 300px;
            font-weight: 600;
            font-size: 0.875rem;
        }
        .toast.success { background-color: #16a34a; color: white; }
        .toast.error { background-color: #dc2626; color: white; }
        .toast.warning { background-color: #ea580c; color: white; }
        @keyframes toast-in {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Calendar Styles */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 0.375rem;
            transition: all 0.2s;
            font-size: 0.875rem;
        }
        .calendar-day:hover:not(:disabled) {
            background-color: #e0e7ff; /* indigo-100 */
            color: #4f46e5; /* indigo-600 */
        }
        .dark .calendar-day:hover:not(:disabled) {
            background-color: #3730a3; /* indigo-800 */
            color: #e0e7ff; /* indigo-100 */
        }
        .calendar-day.selected {
            background-color: #4f46e5; /* indigo-600 */
            color: white;
            font-weight: bold;
        }
        .dark .calendar-day.selected {
            background-color: #6366f1; /* indigo-500 */
        }
        .calendar-day.today {
            border: 1px solid #4f46e5;
        }
        .dark .calendar-day.today {
            border: 1px solid #6366f1;
        }
        .calendar-day.empty {
            cursor: default;
            pointer-events: none;
        }

        /* Print Styles */
        @media print {
            body * {
                visibility: hidden !important;
                overflow: hidden !important;
            }
            .print-options {
                display: none !important;
            }

            .modal-overlay {
                visibility: visible !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: auto !important;
                background: white !important;
                display: block !important;
                z-index: 9999 !important;
            }
            
            .modal-content {
                position: static !important;
                width: 100% !important;
                max-width: none !important;
                max-height: none !important;
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                background: white !important;
                color: black !important;
                overflow: visible !important; 
                transform: none !important; 
            }

            #printable-invoice {
                visibility: visible !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                max-width: none !important;
                min-height: 100vh !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                color: black !important;
                direction: rtl;
                overflow: visible !important;
                border: none !important;
            }
            
            #printable-invoice * {
                visibility: visible !important;
            }
        }
    </style>
</head>
<body class="text-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        // ==================================================
        // Supabase Client Setup
        // ==================================================
        const { createClient } = supabase;
        const supabaseUrl = 'https://wehyjatotbzxargnxasg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlaHlqYXRvdGJ6eGFyZ254YXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE5MTIwMjEsImV4cCI6MjA2NzQ4ODAyMX0.2R448DuEBlTrNvaYXiYZ8D5M7MJNv7n1qmIDHQBNFiY';
        const supabaseClient = createClient(supabaseUrl, supabaseKey, { global: { fetch: window.fetch.bind(window) } });

        // ==================================================
        // Application Configuration
        // ==================================================
        const APP_CONFIG = {
            DEFAULT_SELLER_ID: 'f83dca6b-9bc3-4bc2-8ac0-609a4147269b',
            DEFAULT_CURRENCY: 'Toman'
        };

        // ==================================================
        // Toast Notification System
        // ==================================================
        const ToastContext = React.createContext();

        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = React.useState([]);

            const addToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    removeToast(id);
                }, 5000);
            };

            const removeToast = (id) => {
                setToasts(prev => prev.filter(toast => toast.id !== id));
            };

            return (
                <ToastContext.Provider value={{ addToast }}>
                    {children}
                    <div className="toast-container">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`toast ${toast.type}`}>
                                {toast.type === 'success' ? (
                                    <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                ) : toast.type === 'error' ? (
                                    <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                ) : (
                                    <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                )}
                                <span>{toast.message}</span>
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };

        const useToasts = () => {
            return React.useContext(ToastContext);
        };

        // ==================================================
        // Jalali Data & Calendar Component
        // ==================================================
        const monthNames = [
            "فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور",
            "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"
        ];
        const weekDays = ["ش", "ی", "د", "س", "چ", "پ", "ج"];

        const JalaliDatePicker = ({ isOpen, onClose, onSelect, selectedDate }) => {
            if (!isOpen) return null;

            const getInitialState = () => {
                if (selectedDate) {
                    const parts = selectedDate.split('/');
                    if (parts.length === 3) return { jy: parseInt(parts[0]), jm: parseInt(parts[1]) };
                }
                const today = jalaali.toJalaali(new Date());
                return { jy: today.jy, jm: today.jm };
            };

            const [view, setView] = React.useState(getInitialState());
            const overlayRef = React.useRef();

            const handleOverlayClick = (e) => {
                if (overlayRef.current === e.target) onClose();
            };

            const daysInMonth = jalaali.jalaaliMonthLength(view.jy, view.jm);
            const startDayOfWeek = (() => {
                const g = jalaali.toGregorian(view.jy, view.jm, 1);
                const date = new Date(g.gy, g.gm - 1, g.gd);
                return (date.getDay() + 1) % 7;
            })();

            const handlePrevMonth = () => {
                let { jy, jm } = view;
                jm -= 1;
                if (jm < 1) { jm = 12; jy -= 1; }
                setView({ jy, jm });
            };

            const handleNextMonth = () => {
                let { jy, jm } = view;
                jm += 1;
                if (jm > 12) { jm = 1; jy += 1; }
                setView({ jy, jm });
            };

            const handleYearChange = (delta) => {
                setView(prev => ({ ...prev, jy: prev.jy + delta }));
            };

            const handleDayClick = (day) => {
                const formattedDate = `${view.jy}/${String(view.jm).padStart(2, '0')}/${String(day).padStart(2, '0')}`;
                onSelect(formattedDate);
            };

            const goToday = () => {
                const today = jalaali.toJalaali(new Date());
                setView({ jy: today.jy, jm: today.jm });
            };

            const isSelected = (day) => {
                if (!selectedDate) return false;
                const [sy, sm, sd] = selectedDate.split('/').map(Number);
                return sy === view.jy && sm === view.jm && sd === day;
            };

            const isToday = (day) => {
                const today = jalaali.toJalaali(new Date());
                return today.jy === view.jy && today.jm === view.jm && today.jd === day;
            };

            return (
                <div ref={overlayRef} onClick={handleOverlayClick} className="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
                    <div className="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-sm overflow-hidden animate-[scaleIn_0.2s_ease-out] border dark:border-gray-700">
                        <div className="bg-indigo-600 text-white p-4">
                            <div className="flex justify-between items-center mb-2">
                                <div className="flex items-center gap-1">
                                    <button onClick={() => handleYearChange(-1)} className="p-1 hover:bg-white/20 rounded text-xs transition">سال قبل</button>
                                    <button onClick={handlePrevMonth} className="p-1 hover:bg-white/20 rounded transition">❮</button>
                                </div>
                                <div className="font-bold text-lg">
                                    {monthNames[view.jm - 1]} {view.jy}
                                </div>
                                <div className="flex items-center gap-1">
                                    <button onClick={handleNextMonth} className="p-1 hover:bg-white/20 rounded transition">❯</button>
                                    <button onClick={() => handleYearChange(1)} className="p-1 hover:bg-white/20 rounded text-xs transition">سال بعد</button>
                                </div>
                            </div>
                        </div>

                        <div className="p-4">
                            <div className="calendar-grid mb-2">
                                {weekDays.map(d => (
                                    <div key={d} className="text-center text-xs text-gray-500 dark:text-gray-400 font-bold py-1">
                                        {d}
                                    </div>
                                ))}
                            </div>

                            <div className="calendar-grid">
                                {Array.from({ length: startDayOfWeek }).map((_, i) => (
                                    <div key={`empty-${i}`} className="calendar-day empty"></div>
                                ))}
                                {Array.from({ length: daysInMonth }).map((_, i) => {
                                    const day = i + 1;
                                    return (
                                        <div 
                                            key={day} 
                                            onClick={() => handleDayClick(day)}
                                            className={`calendar-day text-gray-800 dark:text-gray-200 ${isSelected(day) ? 'selected' : ''} ${isToday(day) ? 'today' : ''}`}
                                        >
                                            {day}
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="mt-4 pt-4 border-t border-gray-100 dark:border-gray-700 flex justify-between">
                                <button onClick={goToday} className="text-sm text-indigo-600 dark:text-indigo-400 font-bold hover:underline">برو به امروز</button>
                                <button onClick={onClose} className="text-sm text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white">بستن</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==================================================
        // Helper Functions & UI Components
        // ==================================================
        const formatCurrency = (value) => {
            if (value === null || typeof value === 'undefined' || isNaN(value)) return '-';
            return `${Number(value).toLocaleString('fa-IR')}`;
        };

        const formatNumberWithCommas = (value) => {
            if (value === null || value === undefined || value === '') return '';
            const stringValue = String(value).replace(/,/g, '');
            const numberValue = Number(stringValue);
            if (isNaN(numberValue)) return '';
            return numberValue.toLocaleString('en-US');
        };

        const parseFormattedNumber = (value) => {
            if (typeof value !== 'string' && typeof value !== 'number') return 0;
            if(typeof value === 'number') return value;
            return Number(value.replace(/,/g, '')) || 0;
        };

        const fetchUserBalance = async (userId) => {
            if (!userId) return 0;
            try {
                const { data: transactions, error: txError } = await supabaseClient
                    .from('usertransaction')
                    .select('amount')
                    .eq('userid', userId);
                
                if (txError) throw txError;
                const totalPaid = transactions.reduce((sum, tx) => sum + (tx.amount || 0), 0);

                const { data: invoices, error: invError } = await supabaseClient
                    .from('demandinvoice')
                    .select('totalamount')
                    .eq('customeruserid', userId);

                if (invError) throw invError;
                const totalInvoiced = invoices.reduce((sum, inv) => sum + (inv.totalamount || 0), 0);
                
                return totalPaid - totalInvoiced;
            } catch (err) {
                console.error('Exception fetching balance:', err);
                return 0;
            }
        };

        const PO_STATUSES = ['باید بخرم', 'خریداری شد', 'تحویل بازوی ارسال شد', 'تحویل مشتری شد', 'محاسبه سود و زیان انجام شد', 'Cancelled', 'Merged'];

        const getStatusStyles = (status) => {
            switch (status) {
                case 'باید بخرم': return 'bg-yellow-100 dark:bg-yellow-900/40 text-yellow-800 dark:text-yellow-200 border-yellow-300 dark:border-yellow-700';
                case 'خریداری شد': return 'bg-blue-100 dark:bg-blue-900/40 text-blue-800 dark:text-blue-200 border-blue-300 dark:border-blue-700';
                case 'تحویل بازوی ارسال شد': return 'bg-purple-100 dark:bg-purple-900/40 text-purple-800 dark:text-purple-200 border-purple-300 dark:border-purple-700';
                case 'تحویل مشتری شد': return 'bg-green-100 dark:bg-green-900/40 text-green-800 dark:text-green-200 border-green-300 dark:border-green-700';
                case 'محاسبه سود و زیان انجام شد': return 'bg-teal-100 dark:bg-teal-900/40 text-teal-800 dark:text-teal-200 border-teal-300 dark:border-teal-700';
                case 'Cancelled': return 'bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-200 border-red-300 dark:border-red-700';
                case 'Merged': return 'bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border-gray-400 dark:border-gray-600';
                default: return 'bg-gray-100 dark:bg-gray-700 border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200';
            }
        };
        
        const Modal = ({ isOpen, onClose, title, children, showHeader = true, maxWidth = "max-w-4xl" }) => {
            if (!isOpen) return null;
            return (
                <div className="modal-overlay open" onClick={onClose}>
                    <div className={`modal-content bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 ${maxWidth}`} onClick={e => e.stopPropagation()}>
                        {showHeader && (
                            <div className="flex justify-between items-center mb-4 pb-3 border-b border-gray-200 dark:border-gray-700">
                                <h2 className="text-xl font-bold">{title}</h2>
                                <button onClick={onClose} className="text-gray-400 hover:text-gray-800 dark:hover:text-white text-2xl">&times;</button>
                            </div>
                        )}
                        {children}
                    </div>
                </div>
            );
        };

        // ==================================================
        // ConfirmDeleteModal Component
        // ==================================================
        const ConfirmDeleteModal = ({ isOpen, onClose, onConfirm, invoice }) => {
            if (!isOpen || !invoice) return null;
            return (
                <Modal isOpen={isOpen} onClose={onClose} title="تایید حذف فاکتور" maxWidth="max-w-lg">
                    <div className="text-right">
                        <p className="mb-4 text-lg text-red-600 dark:text-red-400">
                            آیا مطمئن هستید که می‌خواهید فاکتور شماره <span className="font-mono font-bold">{invoice.id}</span> مربوط به مشتری <span className="font-bold">{invoice.customer?.fullname || 'نامشخص'}</span> را حذف کنید؟
                        </p>
                        <p className="text-sm text-gray-500 dark:text-gray-400">
                            توجه: این اقدام غیرقابل بازگشت است و فاکتور و جزئیات آن حذف خواهند شد. همچنین تراکنش‌های مرتبط با این فاکتور نیز حذف می‌شوند.
                        </p>
                    </div>
                    <div className="flex justify-end gap-4 mt-6">
                        <button onClick={onClose} className="bg-gray-200 dark:bg-gray-600 py-2 px-5 rounded-lg font-semibold">انصراف</button>
                        <button onClick={onConfirm} className="bg-red-600 text-white py-2 px-5 rounded-lg font-semibold hover:bg-red-700">حذف فاکتور</button>
                    </div>
                </Modal>
            );
        };

        // ==================================================
        // StatementOfAccountModal Component
        // ==================================================
        const StatementOfAccountModal = ({ isOpen, onClose, customerId, customerName, formatCurrency, supabaseClient }) => {
            const [history, setHistory] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(false);
            const { addToast } = useToasts();
            
            React.useEffect(() => {
                if (!isOpen || !customerId) {
                    setHistory([]);
                    return;
                }

                const fetchHistory = async () => {
                    setIsLoading(true);
                    try {
                        const { data: invoicesData, error: invError } = await supabaseClient
                            .from('demandinvoice')
                            .select('id, createdat, totalamount, note')
                            .eq('customeruserid', customerId);
                        if (invError) throw invError;
                        
                        const { data: transactionsData, error: txError } = await supabaseClient
                            .from('usertransaction')
                            .select('id, createdat, amount, transactiontypeid, description, customer_payment_date')
                            .eq('userid', customerId);
                        if (txError) throw txError;

                        const merged = [];
                        (invoicesData || []).forEach(inv => {
                            merged.push({
                                date: inv.createdat,
                                type: 'فاکتور فروش (بدهکار)', 
                                amount: -Math.abs(inv.totalamount), 
                                refId: inv.id,
                                description: `فاکتور شماره ${inv.id}` + (inv.note ? ` - ${inv.note}` : '')
                            });
                        });
                        (transactionsData || []).forEach(tx => {
                            if (tx.transactiontypeid === 1) { 
                                merged.push({
                                    date: tx.customer_payment_date || tx.createdat,
                                    type: 'دریافت وجه (بستانکار)',
                                    amount: Math.abs(tx.amount), 
                                    refId: tx.id,
                                    description: tx.description ? `دریافت وجه: ${tx.description}` : `پرداخت از طریق تراکنش ${tx.id}`
                                });
                            }
                            else if (tx.transactiontypeid === 2) {
                                merged.push({
                                    date: tx.createdat, // Payouts use createdat by default
                                    type: 'پرداخت به تامین‌کننده (برداشت)',
                                    amount: -Math.abs(tx.amount), 
                                    refId: tx.id,
                                    description: tx.description ? `پرداخت وجه: ${tx.description}` : `تسویه حساب/برداشت طی تراکنش ${tx.id}`
                                });
                            }
                        });
                        
                        merged.sort((a, b) => new Date(a.date) - new Date(b.date));

                        let runningBalance = 0;
                        const finalHistory = merged.map(item => {
                            runningBalance += item.amount;
                            return { ...item, runningBalance };
                        });

                        setHistory(finalHistory);

                    } catch (err) {
                        console.error("Error fetching statement history:", err);
                        addToast('خطا در بارگذاری صورتحساب', 'error');
                    } finally {
                        setIsLoading(false);
                    }
                };

                fetchHistory();
            }, [isOpen, customerId]);

            const handleDownloadExcel = () => {
                if (!history || history.length === 0) {
                    addToast('هیچ داده‌ای برای دانلود وجود ندارد', 'warning');
                    return;
                }

                try {
                    const exportData = history.map(item => ({
                        'تاریخ': new Date(item.date).toLocaleDateString('fa-IR'),
                        'نوع تراکنش': item.type,
                        'شرح': item.description,
                        'مبلغ (تومان)': item.amount,
                        'مانده (تومان)': item.runningBalance
                    }));

                    const ws = XLSX.utils.json_to_sheet(exportData);
                    const wscols = [{wch: 15}, {wch: 25}, {wch: 40}, {wch: 15}, {wch: 15}];
                    ws['!cols'] = wscols;
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Statement");

                    const safeName = customerName ? customerName.replace(/\s+/g, '_') : 'User';
                    const fileName = `Statement_${safeName}_${new Date().toLocaleDateString('fa-IR').replace(/\//g, '-')}.xlsx`;
                    
                    XLSX.writeFile(wb, fileName);
                    addToast('فایل اکسل با موفقیت دانلود شد', 'success');
                } catch (err) {
                    console.error('Export failed:', err);
                    addToast('خطا در ایجاد فایل اکسل', 'error');
                }
            };

            const finalBalance = history.length > 0 ? history[history.length - 1].runningBalance : 0;
            const balanceClass = finalBalance < 0 
                ? 'bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300' 
                : (finalBalance > 0 ? 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300' : 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300');
            
            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`صورتحساب - ${customerName}`} maxWidth="max-w-4xl">
                    <div className="text-right space-y-4">
                        <div className={`p-3 rounded-lg text-lg font-bold ${balanceClass}`}>
                            مانده نهایی حساب: <span dir="ltr">{formatCurrency(finalBalance)}</span> تومان
                        </div>
                        
                        {isLoading ? <div className="spinner"></div> : history.length === 0 ? (
                            <p className="text-center p-4 text-gray-500">هیچ تراکنش مالی برای این کاربر ثبت نشده است.</p>
                        ) : (
                            <div className="overflow-x-auto max-h-[60vh] border rounded-lg dark:border-gray-700">
                                <table className="w-full text-right text-sm min-w-[600px]">
                                    <thead className="sticky top-0 bg-gray-100 dark:bg-gray-700 border-b dark:border-gray-600">
                                        <tr>
                                            <th className="p-3">تاریخ</th>
                                            <th className="p-3">شرح</th>
                                            <th className="p-3">مبلغ (بدهکار/بستانکار)</th>
                                            <th className="p-3">مانده</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {history.map((item, index) => (
                                            <tr key={item.date + index} className="border-b dark:border-gray-700 last:border-b-0 hover:bg-gray-50 dark:hover:bg-gray-700/50">
                                                <td className="p-3 whitespace-nowrap">{new Date(item.date).toLocaleDateString('fa-IR')}</td>
                                                <td className="p-3">
                                                    <div className="font-medium">{item.type}</div>
                                                    <div className="text-xs text-gray-500 dark:text-gray-400 mt-1">{item.description}</div>
                                                </td>
                                                <td className={`p-3 font-mono ${item.amount < 0 ? 'text-red-500' : 'text-green-500'}`} dir="ltr">{formatCurrency(Math.abs(item.amount))}</td>
                                                <td className={`p-3 font-bold ${item.runningBalance < 0 ? 'text-red-500' : 'text-green-500'}`} dir="ltr">{formatCurrency(item.runningBalance)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                    <div className="flex justify-end mt-4 gap-3">
                        <button onClick={onClose} className="bg-gray-200 dark:bg-gray-600 py-2 px-5 rounded-lg font-semibold">بستن</button>
                        <button onClick={handleDownloadExcel} className="bg-indigo-600 text-white py-2 px-5 rounded-lg font-semibold hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled={history.length === 0}>
                            دانلود اکسل
                        </button>
                    </div>
                </Modal>
            );
        };

        // ==================================================
        // Payment & PO Allocation Modal
        // ==================================================
        const PaymentAllocationModal = ({ isOpen, onClose, onSave, preInvoiceData }) => {
            const getInitialDate = () => {
                const today = jalaali.toJalaali(new Date());
                return `${today.jy}/${String(today.jm).padStart(2, '0')}/${String(today.jd).padStart(2, '0')}`;
            };
            
            const [customerPayments, setCustomerPayments] = React.useState([]);
            const [allocations, setAllocations] = React.useState([]);
            const [purchaseDetails, setPurchaseDetails] = React.useState([]);
            const [users, setUsers] = React.useState([]);
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            const { addToast } = useToasts();
            const [searchTerm, setSearchTerm] = React.useState(''); 
            const [activeCustomerCalendarIndex, setActiveCustomerCalendarIndex] = React.useState(null);

            React.useEffect(() => {
                if (preInvoiceData) {
                    setCustomerPayments([{
                        amount: formatNumberWithCommas(preInvoiceData.totalAmount),
                        date: getInitialDate(),
                        description: '',
                        key: Math.random()
                    }]);

                    const initialAllocations = Object.values(preInvoiceData.suppliers).map(supplier => ({
                        userId: supplier.id,
                        amount: '',
                        description: '',
                        key: Math.random()
                    }));
                    setAllocations(initialAllocations);
                    
                    // Initialize purchase details for automatic PO creation
                    setPurchaseDetails(preInvoiceData.items.map(item => ({
                        demand_item_id: item.id,
                        title: item.product.title,
                        supplier_id: item.supplier_id || '',
                        quantity: item.approved_supply_quantity || 0,
                        purchase_price: item.approved_supply_price || 0,
                        actual_shipping_price: 0,
                        supplier_invoice_id: '',
                        note: ''
                    })));
                }
            }, [preInvoiceData]);

            React.useEffect(() => {
                const fetchUsers = async () => {
                    const { data, error } = await supabaseClient
                        .from('profiles')
                        .select('id, fullname, roleid')
                        .in('roleid', [1, 3]); 
                    if (error) {
                        console.error("Error fetching users:", error);
                        addToast('خطا در بارگذاری لیست کاربران', 'error');
                    } else {
                        setUsers(data || []);
                    }
                };
                fetchUsers();
            }, []);
            
            const totalAmountReceived = React.useMemo(() =>
                customerPayments.reduce((sum, p) => sum + parseFormattedNumber(p.amount), 0),
                [customerPayments]
            );

            const totalAllocated = React.useMemo(() =>
                allocations.reduce((sum, alloc) => sum + parseFormattedNumber(alloc.amount), 0),
                [allocations]
            );

            const remainingAmount = totalAmountReceived - totalAllocated;

            const selectedUserIds = React.useMemo(() =>
                new Set(allocations.map(a => a.userId).filter(Boolean)),
                [allocations]
            );

            const handleCustomerPaymentChange = (index, field, value) => {
                const newPayments = [...customerPayments];
                if (field === 'amount') {
                    newPayments[index][field] = formatNumberWithCommas(value);
                } else {
                    newPayments[index][field] = value;
                }
                setCustomerPayments(newPayments);
            };

            const addCustomerPaymentRow = () => {
                setCustomerPayments([...customerPayments, { amount: '', date: getInitialDate(), description: '', key: Math.random() }]);
            };

            const removeCustomerPaymentRow = (index) => {
                setCustomerPayments(customerPayments.filter((_, i) => i !== index));
            };

            const handleAllocationChange = (index, field, value) => {
                const newAllocations = [...allocations];
                if (field === 'amount') {
                    newAllocations[index][field] = formatNumberWithCommas(value);
                } else {
                    newAllocations[index][field] = value;
                }
                setAllocations(newAllocations);
            };

            const handlePurchaseDetailChange = (index, field, value) => {
                const newDetails = [...purchaseDetails];
                if (field === 'supplier_id' || field === 'supplier_invoice_id' || field === 'note') {
                    newDetails[index][field] = value;
                } else {
                    newDetails[index][field] = parseFormattedNumber(value);
                }
                setPurchaseDetails(newDetails);
            };

            const addAllocationRow = () => {
                setAllocations([...allocations, { userId: '', amount: '', description: '', key: Math.random() }]);
            };

            const removeAllocationRow = (index) => {
                const newAllocations = allocations.filter((_, i) => i !== index);
                setAllocations(newAllocations);
            };
            
            const handleSave = async () => {
                const parsedTotalReceived = totalAmountReceived;
                if (totalAllocated > parsedTotalReceived) {
                    addToast('مبلغ تخصیص‌داده شده بیشتر از مجموع مبالغ دریافتی است!', 'warning');
                    return; 
                }

                const validCustomerPayments = [];
                for (const p of customerPayments) {
                    const amt = parseFormattedNumber(p.amount);
                    if (amt <= 0) continue; 
                    
                    const dateParts = p.date.split('/');
                    if (dateParts.length !== 3) {
                         addToast('فرمت تاریخ یکی از پرداختی‌ها نامعتبر است.', 'error');
                         return;
                    }
                    const jy = parseInt(dateParts[0], 10);
                    const jm = parseInt(dateParts[1], 10);
                    const jd = parseInt(dateParts[2], 10);
                    if (!jalaali.isValidJalaaliDate(jy, jm, jd)) {
                        return addToast('تاریخ پرداخت نامعتبر است', 'error');
                    }
                    const g = jalaali.toGregorian(jy, jm, jd);
                    validCustomerPayments.push({
                        amount: amt,
                        gregorianDate: `${g.gy}-${String(g.gm).padStart(2, '0')}-${String(g.gd).padStart(2, '0')}`,
                        description: p.description || ''
                    });
                }
                
                const finalAllocations = allocations
                    .map(a => ({...a, amount: parseFormattedNumber(a.amount), description: a.description}))
                    .filter(a => a.userId && a.amount > 0);

                const missingSuppliers = purchaseDetails.filter(pd => !pd.supplier_id);
                if (missingSuppliers.length > 0) {
                    addToast("لطفا تامین‌کننده تمام اقلام خرید را مشخص کنید.", 'error');
                    return;
                }

                setIsSubmitting(true);
                try {
                    await onSave({
                        validCustomerPayments,
                        allocations: finalAllocations,
                        preInvoiceData,
                        purchaseDetails
                    });
                } catch (error) {
                    // Handled in parent
                } finally {
                    setIsSubmitting(false);
                }
            };

            const filteredUsers = React.useMemo(() => 
                users.filter(user => 
                    user.fullname.toLowerCase().includes(searchTerm.toLowerCase())
                ), 
                [users, searchTerm]
            );

            if (!preInvoiceData) return null;

            return (
                <Modal isOpen={isOpen} onClose={onClose} title="ثبت فاکتور، تخصیص مالی و ایجاد سفارش خرید" maxWidth="max-w-6xl">
                    <div className="space-y-4">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            {/* Right Column: Invoice and Allocations */}
                            <div className="space-y-4 flex flex-col">
                                {/* Customer Payments List */}
                                <div className="border-b dark:border-gray-700 pb-4">
                                    <h3 className="font-semibold mb-3 text-green-700 dark:text-green-400">واریزی‌های مشتری</h3>
                                    <div className="space-y-2 max-h-[30vh] overflow-y-auto custom-scrollbar pr-1">
                                        {customerPayments.map((payment, index) => (
                                            <div key={payment.key} className="flex flex-col gap-2 p-3 bg-green-50 dark:bg-green-900/10 rounded-md border border-green-100 dark:border-green-800">
                                                <div className="flex flex-col xl:flex-row items-center gap-2">
                                                    <div className="relative w-full xl:w-40">
                                                        <div 
                                                            onClick={() => setActiveCustomerCalendarIndex(index)}
                                                            className="w-full border border-gray-300 dark:border-gray-600 rounded-md p-1.5 bg-white dark:bg-gray-600 cursor-pointer flex justify-between items-center text-sm"
                                                        >
                                                            <span className="font-mono text-center w-full">{payment.date}</span>
                                                            <span className="text-gray-400 text-xs">📅</span>
                                                        </div>
                                                        <JalaliDatePicker 
                                                            isOpen={activeCustomerCalendarIndex === index} 
                                                            onClose={() => setActiveCustomerCalendarIndex(null)}
                                                            selectedDate={payment.date}
                                                            onSelect={(selected) => { handleCustomerPaymentChange(index, 'date', selected); setActiveCustomerCalendarIndex(null); }}
                                                        />
                                                    </div>
                                                    <div className="flex w-full xl:w-auto items-center gap-2">
                                                        <input
                                                            type="text"
                                                            placeholder="مبلغ واریزی"
                                                            value={payment.amount}
                                                            onChange={e => handleCustomerPaymentChange(index, 'amount', e.target.value)}
                                                            className="flex-grow xl:w-32 bg-white dark:bg-gray-600 p-1.5 rounded-md text-center outline-none focus:ring-1 focus:ring-green-500 text-sm font-mono"
                                                            dir="ltr"
                                                        />
                                                        <button onClick={() => removeCustomerPaymentRow(index)} className="text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded p-1 font-bold text-lg">&times;</button>
                                                    </div>
                                                </div>
                                                <input
                                                    type="text"
                                                    placeholder="شماره پیگیری یا توضیحات واریز..."
                                                    value={payment.description || ''}
                                                    onChange={e => handleCustomerPaymentChange(index, 'description', e.target.value)}
                                                    className="w-full bg-white dark:bg-gray-600 p-2 rounded-md text-sm outline-none focus:ring-1 focus:ring-green-500 text-left"
                                                    dir="ltr"
                                                />
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={addCustomerPaymentRow} className="mt-3 text-sm text-green-600 dark:text-green-400 font-semibold hover:underline">+ افزودن واریزی جدید</button>
                                </div>

                                {/* Summary Box */}
                                <div className="flex flex-col sm:flex-row justify-between items-center bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg text-sm gap-2 border dark:border-gray-600">
                                    <div dir="rtl" className="w-full flex justify-between sm:block sm:w-auto">
                                        <span className="text-gray-600 dark:text-gray-300">جمع دریافتی: </span>
                                        <span className="font-bold text-green-600" dir="ltr">{formatCurrency(totalAmountReceived)}</span>
                                    </div>
                                    <div dir="rtl" className="w-full flex justify-between sm:block sm:w-auto">
                                        <span className="text-gray-600 dark:text-gray-300">جمع تخصیص: </span>
                                        <span className="font-bold text-red-500" dir="ltr">{formatCurrency(totalAllocated)}</span>
                                    </div>
                                    <div className={`font-bold w-full flex justify-between sm:block sm:w-auto ${remainingAmount < 0 ? 'text-red-500' : 'text-green-500'}`} dir="rtl">
                                        <span className="text-gray-600 dark:text-gray-300">باقی‌مانده: </span>
                                        <span dir="ltr">{formatCurrency(remainingAmount)}</span>
                                    </div>
                                </div>

                                {/* Supplier Allocations List */}
                                <div className="pt-2">
                                    <h3 className="font-semibold mb-3">تخصیص پرداخت به تامین‌کنندگان / کاربران</h3>
                                    
                                    <input
                                        type="text"
                                        placeholder="جستجوی نام کاربر..."
                                        value={searchTerm}
                                        onChange={e => setSearchTerm(e.target.value)}
                                        className="w-full bg-gray-100 dark:bg-gray-700 p-2 rounded-md mb-3 outline-none focus:ring-2 focus:ring-indigo-500"
                                    />

                                    <div className="space-y-2 max-h-[30vh] overflow-y-auto custom-scrollbar pr-1">
                                        {allocations.map((alloc, index) => (
                                            <div key={alloc.key} className="flex flex-col gap-2 p-3 bg-gray-50 dark:bg-gray-700/50 rounded-md border dark:border-gray-600">
                                                <div className="flex flex-col xl:flex-row items-center gap-2">
                                                    <select
                                                        value={alloc.userId}
                                                        onChange={e => handleAllocationChange(index, 'userId', e.target.value)}
                                                        className="w-full xl:flex-grow bg-white dark:bg-gray-600 p-1.5 rounded-md outline-none focus:ring-1 focus:ring-indigo-500 text-sm"
                                                    >
                                                        <option value="">انتخاب کنید...</option>
                                                        {filteredUsers.map(user => (
                                                            <option 
                                                                key={user.id} 
                                                                value={user.id} 
                                                                disabled={selectedUserIds.has(user.id) && alloc.userId !== user.id}
                                                                className="disabled:bg-gray-200 dark:disabled:bg-gray-600"
                                                            >
                                                                {user.fullname} ({user.roleid === 1 ? 'ادمین' : 'تامین کننده'})
                                                            </option>
                                                        ))}
                                                    </select>
                                                    <div className="flex w-full xl:w-auto items-center gap-2">
                                                        <input
                                                            type="text"
                                                            placeholder="مبلغ"
                                                            value={alloc.amount}
                                                            onChange={e => handleAllocationChange(index, 'amount', e.target.value)}
                                                            className="flex-grow xl:w-32 bg-white dark:bg-gray-600 p-1.5 rounded-md text-center outline-none focus:ring-1 focus:ring-indigo-500 text-sm font-mono"
                                                            dir="ltr"
                                                        />
                                                        <button onClick={() => removeAllocationRow(index)} className="text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded p-1 font-bold text-lg">&times;</button>
                                                    </div>
                                                </div>
                                                <input
                                                    type="text"
                                                    placeholder="شماره پیگیری یا توضیحات تراکنش..."
                                                    value={alloc.description || ''}
                                                    onChange={e => handleAllocationChange(index, 'description', e.target.value)}
                                                    className="w-full bg-white dark:bg-gray-600 p-2 rounded-md text-sm outline-none focus:ring-1 focus:ring-indigo-500 text-left"
                                                    dir="ltr"
                                                />
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={addAllocationRow} className="mt-3 text-sm text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">+ افزودن پرداخت جدید</button>
                                </div>
                            </div>

                            {/* Left Column: PO Generation Details */}
                            <div className="border-t lg:border-t-0 lg:border-r dark:border-gray-700 lg:pr-6 pt-4 lg:pt-0">
                                <h3 className="font-semibold mb-3 text-indigo-700 dark:text-indigo-300">جزئیات خرید (ایجاد خودکار PO)</h3>
                                <p className="text-xs text-gray-500 mb-3">مقادیر نهایی خرید را وارد کنید. سفارشات خرید بر اساس تامین‌کننده تفکیک خواهند شد.</p>
                                <div className="space-y-3 max-h-[65vh] overflow-y-auto custom-scrollbar pr-1">
                                    {purchaseDetails.map((pd, index) => (
                                        <div key={pd.demand_item_id} className="bg-gray-50 dark:bg-gray-700/40 p-3 rounded-lg border dark:border-gray-600 space-y-3">
                                            <div className="font-bold text-sm text-gray-800 dark:text-gray-200 border-b dark:border-gray-600 pb-2">{pd.title}</div>
                                            <div className="grid grid-cols-2 gap-3 text-sm">
                                                <div className="col-span-2">
                                                    <label className="block text-xs text-gray-500 dark:text-gray-400 mb-1">تامین‌کننده</label>
                                                    <select 
                                                        value={pd.supplier_id} 
                                                        onChange={e => handlePurchaseDetailChange(index, 'supplier_id', e.target.value)}
                                                        className="w-full bg-white dark:bg-gray-600 p-1.5 rounded-md border outline-none focus:ring-1 focus:ring-indigo-500"
                                                    >
                                                        <option value="">انتخاب...</option>
                                                        {users.filter(u => u.roleid === 3 || u.roleid === 1).map(u => (
                                                            <option key={u.id} value={u.id}>{u.fullname}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-gray-500 dark:text-gray-400 mb-1">تعداد نهایی</label>
                                                    <input type="number" value={pd.quantity} onChange={e => handlePurchaseDetailChange(index, 'quantity', e.target.value)} className="w-full bg-white dark:bg-gray-600 p-1.5 rounded-md border text-center outline-none focus:ring-1 focus:ring-indigo-500" dir="ltr" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-gray-500 dark:text-gray-400 mb-1">قیمت واحد (تومان)</label>
                                                    <input type="text" value={formatNumberWithCommas(pd.purchase_price)} onChange={e => handlePurchaseDetailChange(index, 'purchase_price', e.target.value)} className="w-full bg-white dark:bg-gray-600 p-1.5 rounded-md border text-center outline-none focus:ring-1 focus:ring-indigo-500" dir="ltr" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-gray-500 dark:text-gray-400 mb-1 text-indigo-600 dark:text-indigo-400">ارسال واحد واقعی</label>
                                                    <input type="text" value={formatNumberWithCommas(pd.actual_shipping_price)} onChange={e => handlePurchaseDetailChange(index, 'actual_shipping_price', e.target.value)} className="w-full bg-indigo-50 dark:bg-indigo-900/30 border-indigo-200 dark:border-indigo-700 p-1.5 rounded-md border text-center outline-none focus:ring-1 focus:ring-indigo-500" dir="ltr" />
                                                </div>
                                                <div className="flex flex-col justify-end">
                                                    <label className="block text-xs text-gray-500 dark:text-gray-400 mb-1">جمع کل ردیف</label>
                                                    <div className="p-1.5 font-mono font-bold text-left bg-gray-100 dark:bg-gray-600 rounded border border-transparent" dir="ltr">
                                                        {formatNumberWithCommas(pd.quantity * pd.purchase_price)}
                                                    </div>
                                                </div>
                                                <div className="col-span-2 grid grid-cols-2 gap-3 mt-2 border-t dark:border-gray-600 pt-2">
                                                    <div>
                                                        <label className="block text-xs text-gray-500 dark:text-gray-400 mb-1">شماره فاکتور تامین‌کننده</label>
                                                        <input type="text" placeholder="مثلا: 12345" value={pd.supplier_invoice_id || ''} onChange={e => handlePurchaseDetailChange(index, 'supplier_invoice_id', e.target.value)} className="w-full bg-white dark:bg-gray-600 p-1.5 rounded-md border text-right outline-none focus:ring-1 focus:ring-indigo-500" dir="rtl" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs text-gray-500 dark:text-gray-400 mb-1">یادداشت خرید</label>
                                                        <input type="text" placeholder="توضیحات اختیاری..." value={pd.note || ''} onChange={e => handlePurchaseDetailChange(index, 'note', e.target.value)} className="w-full bg-white dark:bg-gray-600 p-1.5 rounded-md border text-right outline-none focus:ring-1 focus:ring-indigo-500" dir="rtl" />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                            <button onClick={onClose} className="px-5 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">انصراف</button>

        // ==================================================
        // Edit Invoice Modal Component
        // ==================================================
        const EditInvoiceModal = ({ isOpen, onClose, onSave, invoice: initialInvoice, addToast }) => {
            const [invoice, setInvoice] = React.useState(initialInvoice);
            const [isSubmitting, setIsSubmitting] = React.useState(false);

            React.useEffect(() => {
                if (initialInvoice) {
                    const loadedInvoice = JSON.parse(JSON.stringify(initialInvoice));
                    const totalHeaderShipping = loadedInvoice.totalshippingprice || 0;
                    const totalItemShipping = loadedInvoice.demandinvoicedetail.reduce((sum, item) => sum + (item.shippingprice || 0), 0);

                    if (totalHeaderShipping > 0 && totalItemShipping === 0 && loadedInvoice.demandinvoicedetail.length > 0) {
                        const count = loadedInvoice.demandinvoicedetail.length;
                        const baseShipping = Math.floor(totalHeaderShipping / count);
                        let remainder = totalHeaderShipping % count;

                        loadedInvoice.demandinvoicedetail.forEach(detail => {
                            let alloc = baseShipping;
                            if (remainder > 0) {
                                alloc += 1;
                                remainder--;
                            }
                            detail.shippingprice = alloc;
                        });
                    }
                    setInvoice(loadedInvoice);
                }
            }, [initialInvoice]);

            if (!invoice) return null;

            const recalculateTotal = (updatedInvoice) => {
                const subtotal = updatedInvoice.demandinvoicedetail.reduce((sum, item) => sum + (item.quantity * item.sales_price), 0);
                const discount = updatedInvoice.discount || 0;
                const shipping = updatedInvoice.demandinvoicedetail.reduce((sum, item) => sum + (item.shippingprice || 0), 0);
                return { total: subtotal - discount + shipping, totalShipping: shipping };
            };

            const handlePriceChange = (detailId, newPrice) => {
                setInvoice(prev => {
                    const updatedDetails = prev.demandinvoicedetail.map(detail => {
                        if (detail.id === detailId) return { ...detail, sales_price: parseFormattedNumber(newPrice) };
                        return detail;
                    });
                    const newInvoice = { ...prev, demandinvoicedetail: updatedDetails };
                    const { total, totalShipping } = recalculateTotal(newInvoice);
                    return { ...newInvoice, totalamount: total, totalshippingprice: totalShipping };
                });
            };

            const handleShippingChange = (detailId, newShipping) => {
                setInvoice(prev => {
                    const updatedDetails = prev.demandinvoicedetail.map(detail => {
                        if (detail.id === detailId) return { ...detail, shippingprice: parseFormattedNumber(newShipping) };
                        return detail;
                    });
                    const newInvoice = { ...prev, demandinvoicedetail: updatedDetails };
                    const { total, totalShipping } = recalculateTotal(newInvoice);
                    return { ...newInvoice, totalamount: total, totalshippingprice: totalShipping };
                });
            };

            const handleInputChange = (field, value) => {
                setInvoice(prev => {
                    const newInvoice = { ...prev };
                    if (field === 'note') newInvoice.note = value;
                    else newInvoice[field] = parseFormattedNumber(value);
                    const { total } = recalculateTotal(newInvoice);
                    return { ...newInvoice, totalamount: total };
                });
            };

            const handleSave = async () => {
                setIsSubmitting(true);
                try {
                    const detailUpdates = invoice.demandinvoicedetail.map(detail => 
                        supabaseClient
                            .from('demandinvoicedetail')
                            .update({ sales_price: detail.sales_price, shippingprice: detail.shippingprice })
                            .eq('id', detail.id)
                    );
                    const detailResults = await Promise.all(detailUpdates);
                    const firstDetailError = detailResults.find(res => res.error);
                    if (firstDetailError) throw firstDetailError.error;

                    const { error: invoiceUpdateError } = await supabaseClient
                        .from('demandinvoice')
                        .update({ 
                            totalamount: invoice.totalamount,
                            discount: invoice.discount || 0,
                            totalshippingprice: invoice.totalshippingprice,
                            note: invoice.note || ''
                        })
                        .eq('id', invoice.id);
                    
                    if (invoiceUpdateError) throw invoiceUpdateError;
                    
                    addToast('فاکتور با موفقیت به‌روزرسانی شد!', 'success');
                    onSave();
                } catch (err) {
                    console.error("Error updating invoice:", err);
                    addToast(`خطا در به‌روزرسانی فاکتور: ${err.message}`, 'error');
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`ویرایش فاکتور شماره ${invoice.id}`} maxWidth="max-w-4xl">
                    <div className="space-y-4">
                        <div className="overflow-x-auto border rounded-lg dark:border-gray-700">
                           <table className="w-full text-right min-w-[500px] text-sm">
                                <thead className="bg-gray-100 dark:bg-gray-700">
                                    <tr>
                                        <th className="p-3">محصول</th>
                                        <th className="p-3">تعداد</th>
                                        <th className="p-3">قیمت فروش</th>
                                        <th className="p-3">هزینه ارسال</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {invoice.demandinvoicedetail.map(detail => (
                                        <tr key={detail.id} className="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50">
                                            <td className="p-3">{detail.product?.title || 'نامشخص'}</td>
                                            <td className="p-3 font-medium text-center">{detail.quantity}</td>
                                            <td className="p-3">
                                                <input type="text" value={formatNumberWithCommas(detail.sales_price)} onChange={e => handlePriceChange(detail.id, e.target.value)} className="w-full max-w-[120px] bg-white dark:bg-gray-600 border p-1.5 rounded-md text-center outline-none focus:ring-1 focus:ring-indigo-500" dir="ltr" />
                                            </td>
                                            <td className="p-3">
                                                <input type="text" value={formatNumberWithCommas(detail.shippingprice)} onChange={e => handleShippingChange(detail.id, e.target.value)} className="w-full max-w-[120px] bg-white dark:bg-gray-600 border p-1.5 rounded-md text-center outline-none focus:ring-1 focus:ring-indigo-500" dir="ltr" />
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 bg-gray-50 dark:bg-gray-700/30 p-4 rounded-lg">
                            <div>
                                <label className="block text-sm font-medium mb-1">تخفیف کل (تومان)</label>
                                <input type="text" placeholder="0" value={formatNumberWithCommas(invoice.discount)} onChange={e => handleInputChange('discount', e.target.value)} className="w-full bg-white dark:bg-gray-600 border p-2 rounded-md outline-none focus:ring-1 focus:ring-indigo-500" dir="ltr" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1 text-gray-500">جمع کل هزینه ارسال (خودکار)</label>
                                <input type="text" value={formatNumberWithCommas(invoice.totalshippingprice)} readOnly disabled className="w-full bg-gray-200 dark:bg-gray-700 border border-transparent p-2 rounded-md cursor-not-allowed" dir="ltr" />
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-sm font-medium mb-1">یادداشت</label>
                                <textarea value={invoice.note || ''} onChange={e => handleInputChange('note', e.target.value)} rows="2" className="w-full bg-white dark:bg-gray-600 border p-2 rounded-md outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
                            </div>
                        </div>

                        <div className="flex justify-between items-center border-t dark:border-gray-700 pt-4 mt-4">
                            <div className="font-bold text-lg text-indigo-700 dark:text-indigo-400">
                                مبلغ کل جدید: <span dir="ltr" className="font-mono">{formatCurrency(invoice.totalamount)}</span> تومان
                            </div>
                            <div className="flex gap-3">
                                <button onClick={onClose} className="bg-gray-200 dark:bg-gray-600 py-2 px-5 rounded-lg text-sm font-semibold">انصراف</button>
                                <button onClick={handleSave} disabled={isSubmitting} className="bg-indigo-600 text-white py-2 px-5 rounded-lg text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50">
                                    {isSubmitting ? 'در حال ذخیره...' : 'ذخیره تغییرات'}
                                </button>
                            </div>
                        </div>
                    </div>
                </Modal>

        const AddPaymentModal = ({ supplier, onClose, onSave }) => {
            const [transactionType, setTransactionType] = React.useState('2'); // 2 = Payout (Debit), 1 = Receive (Credit)
            const [amount, setAmount] = React.useState('');
            
            const getInitialDate = () => {
                const today = jalaali.toJalaali(new Date());
                return `${today.jy}/${String(today.jm).padStart(2, '0')}/${String(today.jd).padStart(2, '0')}`;
            };
            
            const [date, setDate] = React.useState(getInitialDate());
            const [description, setDescription] = React.useState('');
            const [isCalendarOpen, setIsCalendarOpen] = React.useState(false);
            const [isSaving, setIsSaving] = React.useState(false);
            const { addToast } = useToasts();

            const handleSave = async (e) => {
                e.preventDefault();
                const rawAmount = parseFormattedNumber(amount);
                if (rawAmount <= 0) return addToast('مبلغ باید بزرگتر از صفر باشد', 'error');
                
                const dateParts = date.split('/');
                if (dateParts.length !== 3) return addToast('تاریخ انتخاب نشده است', 'error');
                
                const jy = parseInt(dateParts[0], 10);
                const jm = parseInt(dateParts[1], 10);
                const jd = parseInt(dateParts[2], 10);

                if (!jalaali.isValidJalaaliDate(jy, jm, jd)) {
                    return addToast('تاریخ نامعتبر است', 'error');
                }

                const g = jalaali.toGregorian(jy, jm, jd);
                const gregorianDate = `${g.gy}-${String(g.gm).padStart(2, '0')}-${String(g.gd).padStart(2, '0')}`;

                setIsSaving(true);
                const finalAmount = transactionType === '1' ? rawAmount : -rawAmount;
                
                await onSave({
                    userid: supplier.id,
                    amount: finalAmount,
                    createdat: gregorianDate,
                    transactiontypeid: parseInt(transactionType),
                    description: description || ''
                });
                setIsSaving(false);
            };

            return (
                <Modal isOpen={!!supplier} onClose={onClose} title={`ثبت تراکنش دستی برای: ${supplier.fullname}`} maxWidth="max-w-xl">
                     <form onSubmit={handleSave} className="space-y-5">
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label className="block text-sm font-medium mb-1.5">نوع عملیات</label>
                                <div className="flex gap-2 p-1 bg-gray-100 dark:bg-gray-700 rounded-lg">
                                    <button 
                                        type="button"
                                        onClick={() => setTransactionType('1')}
                                        className={`flex-1 py-2.5 rounded-md text-sm font-medium transition ${transactionType === '1' ? 'bg-white dark:bg-gray-800 text-green-600 shadow-sm' : 'text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-600'}`}
                                    >
                                        + دریافت وجه
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={() => setTransactionType('2')}
                                        className={`flex-1 py-2.5 rounded-md text-sm font-medium transition ${transactionType === '2' ? 'bg-white dark:bg-gray-800 text-red-600 shadow-sm' : 'text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-600'}`}
                                    >
                                        - پرداخت وجه
                                    </button>
                                </div>
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium mb-1.5">مبلغ (تومان)</label>
                                <input 
                                    type="text" 
                                    value={formatNumberWithCommas(amount)} 
                                    onChange={(e) => setAmount(e.target.value)} 
                                    className="w-full p-2.5 bg-gray-50 dark:bg-gray-700 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-indigo-500 outline-none text-left font-mono font-bold text-lg" 
                                    placeholder="0" 
                                    dir="ltr" 
                                />
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div className="relative">
                                <label className="block text-sm font-medium mb-1.5">تاریخ تراکنش</label>
                                <div 
                                    onClick={() => setIsCalendarOpen(true)}
                                    className="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 bg-gray-50 dark:bg-gray-700 cursor-pointer flex justify-between items-center hover:border-indigo-500 transition"
                                >
                                    <span className="font-mono">{date}</span>
                                    <span className="text-gray-400">📅</span>
                                </div>
                                <JalaliDatePicker 
                                    isOpen={isCalendarOpen} 
                                    onClose={() => setIsCalendarOpen(false)}
                                    selectedDate={date}
                                    onSelect={(selected) => { setDate(selected); setIsCalendarOpen(false); }}
                                />
                            </div>

                            <div>

                                {isSaving && <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>}
